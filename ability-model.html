<script>
(function(){
  if("scrollRestoration" in history){ try{ history.scrollRestoration = "manual"; }catch(e){} }
  var h = location.hash;
  if(h){
    try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
    window.__savedHash = h;
  }
  try{ window.scrollTo(0, 0); }catch(e){}
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人能力模型</title>
<link rel="stylesheet" href="assets/site.css?v=70">
<link rel="stylesheet" href="assets/search.css?v=70">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet">
<style>
html.preload,html.preload *{transition:none!important;animation:none!important;}
.pain-section{--abline:#6A6058;}

/* ===== 左侧维度导航（与成长之路同款交互） ===== */
.side-nav .nav-group{margin-bottom:12px;}
.side-nav .group-title{
  font-size:13.5px;font-weight:700;color:var(--title);letter-spacing:.3px;
  padding:12px 12px 7px;
  transition:background var(--dur) ease,color var(--dur) ease;
  display:flex;align-items:center;justify-content:space-between;gap:6px;
}
.side-nav .group-title.active{color:var(--brand);}
.side-nav .group-title.active .group-toggle{color:var(--brand);}
.side-nav .nav-group ul{list-style:none;}
.side-nav .nav-group li{margin:0 0 3px;}
.side-nav .nav-group a{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 12px 9px 24px;border-radius:8px;position:relative;
  font-size:13px;color:var(--text-2);text-decoration:none;letter-spacing:.2px;
  transition:background var(--dur) ease,color var(--dur) ease;
}
.side-nav .nav-group a:hover{background:none;color:var(--brand);}
.side-nav .nav-group a.active{
  background:#fff;color:var(--brand);font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,0.06);
}
.side-nav .nav-group a.active::before{
  content:'';position:absolute;left:5px;top:50%;transform:translateY(-50%);
  width:3px;height:16px;background:var(--brand);border-radius:2px;
}

/* ===== 详情区：字阶与组件全部对齐书籍知识卡片（#375 重建） ===== */
.ab-hero{
  background:var(--card);border:2.5px solid var(--abline);border-radius:14px;
  box-shadow:3px 4px 0 rgba(32,25,20,.07);padding:24px 28px;
  margin-bottom:6px;
}
.ab-hero h1{
  font-size:26px;font-weight:700;color:var(--brand);
  letter-spacing:.3px;margin:0;line-height:1.35;
}
/* 相邻独立卡（结构卡）：卡与卡之间留呼吸空隙 */
.ab-hero + .ab-hero{margin-top:26px;}
.ab-role{font-size:15.5px;line-height:1.75;color:#201914;margin:10px 0 0;}
.ab-hero .bp{font-size:15.5px;margin-top:12px;}
/* 头卡内的小节标题（误区与定义同居一个大框） */
.ab-hero .ab-stitle{font-size:17px;margin-top:20px;}
.ab-hero .mvswrap{margin-top:14px;}
/* 区块标题（无下划线——设计规范禁标题下划线） */
.ab-sec{margin-top:36px;}
.ab-stitle{
  font-size:20px;font-weight:400;color:#201914;letter-spacing:.5px;
  display:inline-block;position:relative;
}
/* 缺失表现：红色椭圆标签 */
.sym-cloud{
  margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;
  align-items:center;
}
.stag{
  font-size:13.5px;color:var(--brand);border:2px solid var(--brand);
  border-radius:20px;padding:4px 12px;background:rgba(224,67,46,.04);
  white-space:nowrap;line-height:1.4;
}
/* 提升方法：概念卡（红圆号+红名+正文） */
.ab-concepts{display:flex;flex-direction:column;gap:16px;margin-top:18px;}
.concept{
  background:var(--card);border:2.5px solid var(--abline);border-radius:12px;
  padding:17px 21px;box-shadow:3px 4px 0 rgba(32,25,20,.06);
}
.concept .chead{display:flex;gap:11px;align-items:center;margin-bottom:13px;}
.concept .cnum{
  flex:0 0 26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;
  font-size:13.5px;display:flex;align-items:center;justify-content:center;
}
.concept .cname{font-size:16.5px;color:var(--brand);line-height:1.35;font-weight:400;}
.concept .cbody{margin-top:0;font-size:15.5px;line-height:1.75;color:#201914;}
.concept .cbody p+p{margin-top:6px;}
.concept .csteps{margin-top:10px;display:flex;flex-direction:column;gap:7px;}
.concept .lv{display:flex;gap:10px;align-items:flex-start;}
.concept .lvn{
  flex:0 0 20px;height:20px;border-radius:50%;background:var(--abline);color:#fff;
  font-size:11.5px;display:flex;align-items:center;justify-content:center;margin-top:3px;
}
.concept .lvc{font-size:15px;color:#201914;line-height:1.7;flex:1;}
/* 误区 */
.ab-myths{display:flex;flex-direction:column;gap:12px;}
.myth{
  background:var(--card);border:2.5px solid var(--abline);border-radius:12px;
  padding:13px 17px;box-shadow:3px 4px 0 rgba(32,25,20,.06);
  font-size:15.5px;line-height:1.75;color:#201914;
}
/* 误区对比：照抄组件库/纳瓦尔宝典 .vs 真值（实线外框圆角16 + 列间竖虚线 + 圆角矩形tag + vt红字结论/vd说明/ve后果） */
.mvswrap{margin-top:14px;border:2.5px solid var(--abline);border-radius:16px;overflow:hidden;background:var(--card);display:grid;grid-template-columns:1fr 1fr;}
.mvswrap .mcol{padding:18px 20px;min-width:0;}
.mvswrap .mcol:first-child{border-right:2.5px dashed var(--abline);padding-left:20px;}
.mvswrap .mcol:last-child{padding-right:20px;}
.mvs2 .mcol{padding:0 14px;min-width:0;}
.mvs2 .mcol:first-child{border-right:2.5px dashed var(--abline);padding-left:0;}
.mvs2 .mcol:last-child{padding-right:0;}
.mvswrap .tag, .mvs2 .tag{display:inline-block;font-size:14.5px;font-weight:700;color:#fff;background:var(--brand);
  padding:5px 16px;border-radius:10px;margin-bottom:10px;letter-spacing:1px;}
.mvswrap .mcol:last-child .tag, .mvs2 .mcol:last-child .tag{background:#4ECDC4;}
.mvswrap .vt, .mvs2 .vt{font-size:15.5px;color:var(--brand);line-height:1.5;}
.mvswrap .vd, .mvs2 .vd{margin-top:8px;font-size:15px;color:#201914;line-height:1.75;}
.ab-mythhead{margin-top:22px;font-size:15.5px;line-height:1.75;color:#201914;}
.ab-mythhead .t{font-size:17px;color:#201914;letter-spacing:.5px;}
/* 多组误区=多组对比框竖排（组件库真值：每组一个 .vs 框），框间只留间距，不加额外边框 */
.ab-myths-multi{display:flex;flex-direction:column;gap:12px;}
.ab-myths-multi .mvswrap{margin-top:0;}
/* 缩进拆解：组件库 .indent 真值（左灰条；头卡/卡内的名+说明，不用红标签块） */
.indent{margin-top:10px;padding:2px 0 2px 14px;border-left:3px solid var(--abline);}
.indent:first-child{margin-top:0;}
.indent b{color:var(--brand);font-weight:400;display:block;margin-bottom:2px;}
.indent .it{font-size:15px;line-height:1.75;color:#201914;}
/* 案例：虚线纸底 */
.ab-cases{margin-top:14px;}
.example{border:2px dashed rgba(106,96,88,.55);border-radius:10px;padding:13px 16px 18px;
  margin:12px 0 16px;background:rgba(251,246,240,.7);}
.example .ex-title{font-size:12.5px;color:#9C928A;margin-bottom:5px;}
.example .bp{font-size:15px;line-height:1.75;margin:0;}
/* 纵向流程网格 3×3：左列=流程（节点纵向，↓衔接），中列=处理逻辑，右列=案例 */
.ioflow{margin:12px 0 2px;display:grid;grid-template-columns:112px 1fr 1fr;gap:9px 12px;align-items:stretch;}
.ioflow.nocase{grid-template-columns:112px 1fr;}
.io-lead{grid-column:1/-1;font-size:15px;color:#201914;line-height:1.7;margin-bottom:2px;}
.io-node{border:2.5px solid var(--brand);border-radius:12px;background:rgba(224,67,46,.07);
  display:flex;align-items:center;justify-content:center;text-align:center;white-space:nowrap;
  padding:10px 8px;font-size:15px;color:#201914;line-height:1.4;}
.io-arrow{grid-column:1/-1;display:flex;align-items:center;justify-content:flex-start;
  padding-left:46px;font-size:19px;color:var(--brand);line-height:1;}
.io-x{align-self:center;font-size:15.5px;line-height:1.75;color:#201914;}
.io-case{border:2px dashed rgba(106,96,88,.55);border-radius:10px;padding:9px 13px;
  background:rgba(251,246,240,.7);font-size:14.5px;line-height:1.7;color:#201914;}
.io-case .lab{display:block;font-size:12.5px;color:#9C928A;margin-bottom:3px;}
.io-note{grid-column:1/-1;margin-top:4px;border-top:2px dashed rgba(106,96,88,.55);padding-top:11px;
  font-size:15px;line-height:1.75;color:#201914;}
/* 组卡：无序号无外框 */
.cgroup{margin-top:2px;}
.cgroup .gname{font-size:16.5px;color:var(--brand);line-height:1.4;margin:14px 0 10px;}
.cgroup:first-child .gname{margin-top:0;}
/* 方法区引导语 */
.ab-mlead{font-size:15.5px;line-height:1.75;color:#201914;margin:12px 0 0;}
.ab-mlead + .ab-concepts{margin-top:10px;}
/* ===== 卡内组件 ===== */
.bp{font-size:15.5px;line-height:1.75;color:#201914;margin:0 0 8px;}
.bp:last-child{margin-bottom:0;}
/* 编号要点清单：整体一个大框 + 行式条目 + 品牌红单色编号圈；
   不一条一个框（框海），也不搞多色循环（同页多色=乱） */
.bsteps{display:flex;flex-direction:column;gap:13px;margin:10px 0 2px;
  border:2px solid var(--abline);border-radius:12px;padding:14px 16px;background:var(--card);}
.bstep{display:flex;gap:13px;align-items:flex-start;}
.bstep .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;
  font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:2px;}
.bstep .x{flex:1;font-size:15px;line-height:1.7;color:#201914;}
/* 条目多且短时双列排布，降低纵向拥挤感；列优先填充（左列1234/右列5678），每格独立虚线框做视觉分割 */
.bsteps.cols2{border:none;background:transparent;padding:0;
  display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(4,auto);gap:12px;}
.bsteps.cols2 .bstep{border:2px solid var(--abline);background:var(--card);border-radius:10px;padding:11px 13px;align-items:flex-start;}
/* 红标签行：组件库 .five 真值；单列对齐网格，标签 nowrap 不折行、正文左缘对齐；
   标签=浅红底红字（同故事标签形态：浅底彩字），单色不抢主色调，不做多色循环 */
.kvs{display:grid;grid-template-columns:auto 1fr;column-gap:12px;row-gap:8px;align-items:start;margin:10px 0 2px;}
.kv{display:contents;}
.kv .n{padding:2px 10px;border-radius:8px;background:#FDE8E4;color:var(--brand);font-size:13px;line-height:1.6;text-align:center;white-space:nowrap;}
.kv .x{font-size:15px;line-height:1.72;color:#201914;}
/* 嵌套小卡 */
.subs{display:flex;flex-direction:column;gap:13px;margin:10px 0 2px;}
.sub{border:2px solid var(--abline);border-radius:12px;padding:13px 16px;background:var(--card);}
.sub .shead{display:flex;gap:10px;align-items:center;margin-bottom:13px;}
.sub .sn{flex:0 0 26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;
  font-size:14px;display:flex;align-items:center;justify-content:center;}
.sub .n{color:var(--brand);font-size:15.5px;line-height:1.5;}
.sub .x{font-size:15px;line-height:1.72;color:#201914;}
.sub .x .bp{font-size:15px;}
.sub .lv{display:flex;gap:10px;align-items:flex-start;margin-top:6px;}
.sub .lvn{flex:0 0 20px;height:20px;border-radius:50%;background:var(--abline);color:#fff;
  font-size:11.5px;display:flex;align-items:center;justify-content:center;margin-top:3px;}
.sub .lvc{font-size:15px;color:#201914;line-height:1.7;flex:1;}
.sub .example{margin-top:11px;}
.sub-steps{margin-top:4px;}
.sub-tail{margin-top:6px;}
/* 话术引用：说的话不用虚线框（虚线框=例子的专用样式），红字引文+前置引号，一眼看出是话 */
.callout{margin:14px 0 6px;padding:0 0 0 26px;position:relative;
  font-size:15px;line-height:1.85;color:var(--brand);}
.callout::before{content:"“";position:absolute;left:0;top:-4px;
  font-size:30px;color:var(--brand);line-height:1;}
/* 方法清单：红字引导条 + 编号子卡（红圈+红名+内容卡片化），不再平铺信息罗列 */
.cline{margin:10px 0 2px;display:flex;flex-direction:column;gap:10px;}
.cline .clinelab{font-size:14px;color:var(--brand);background:rgba(224,67,46,.07);
  padding:8px 12px;border-radius:8px;}
.cline .example{margin-top:2px;}
/* 框架格子：5W1H 工具说明 .grid/.subcell 真值（灰底圆角格 + 居中粗标题 + 说明） */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin:10px 0 2px;}
.fcell{background:rgba(106,96,88,.07);border-radius:12px;padding:18px 16px;}
.fcell h4{font-size:15px;font-weight:700;color:#201914;letter-spacing:1px;margin:0 0 10px;text-align:center;}
.fcell .explain{font-size:15px;color:#201914;line-height:1.7;margin:0;text-align:left;}
@media (max-width:640px){.fgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}.fcell{padding:14px 12px;}.mini-vs{grid-template-columns:1fr;}}
/* 标签云：组件库 .tags 真值 */
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 2px;}
.tagx{font-size:13.5px;color:#201914;background:rgba(106,96,88,.10);
  border:2px solid var(--abline);border-radius:18px;padding:4px 11px;white-space:nowrap;}
/* 横向流程图：每个节点=节点框+正下方说明（说明与环节一一对齐）；箭头与节点框等高垂直居中 */
.hflow{display:flex;align-items:flex-start;justify-content:center;gap:0;margin:16px 0 2px;}
.hflow .hcol{display:flex;flex-direction:column;align-items:center;}
.hflow .hn{flex:0 0 auto;border:2.5px solid var(--brand);border-radius:10px;
  background:rgba(224,67,46,.05);padding:9px 24px;text-align:center;
  font-size:15.5px;color:var(--brand);font-weight:700;letter-spacing:2px;line-height:1.4;}
.hflow .ha{flex:0 0 44px;height:45px;display:flex;align-items:center;justify-content:center;
  font-size:20px;color:var(--brand);line-height:1;}
.hflow .hcap{margin-top:9px;font-size:14.5px;color:#201914;line-height:1.7;text-align:center;}
/* 分阶段流程图：阶段分行（左=红阶段标签，右=内容），阶段间↓衔接时序；贯穿项=浅红底圆角标签行 */
.pflow{margin:16px 0 2px;}
.pflow .phase{display:flex;align-items:flex-start;gap:14px;}
.pflow .plab{flex:0 0 104px;margin-top:2px;border:2.5px solid var(--brand);border-radius:10px;
  background:rgba(224,67,46,.05);padding:9px 0;text-align:center;
  font-size:15.5px;color:var(--brand);font-weight:700;letter-spacing:2px;line-height:1.4;}
.pflow .pjoin{padding-left:41px;font-size:18px;color:#9C928A;line-height:1.15;margin:3px 0;}
.pflow .pbody{flex:1 1 auto;min-width:0;}
.pflow .pchain{display:flex;align-items:flex-start;gap:0;margin:2px 0 4px;}
.pflow .pchain.flat{gap:12px;flex-wrap:wrap;}
.pflow .hcol{display:flex;flex-direction:column;align-items:center;}
.pflow .hn{flex:0 0 auto;border:2.5px solid var(--brand);border-radius:10px;
  background:rgba(224,67,46,.05);padding:9px 20px;text-align:center;
  font-size:15.5px;color:var(--brand);font-weight:700;letter-spacing:2px;line-height:1.4;}
.pflow .ha{flex:0 0 40px;height:45px;display:flex;align-items:center;justify-content:center;
  font-size:20px;color:var(--brand);line-height:1;}
.pflow .hcap{margin-top:9px;font-size:14.5px;color:#201914;line-height:1.7;text-align:center;}
.pflow .pthrough{display:flex;align-items:center;gap:10px;margin:2px 0 12px;flex-wrap:wrap;}
.pflow .pt-lab{font-size:13px;color:#9C928A;letter-spacing:1px;white-space:nowrap;}
.pflow .ptag{font-size:14px;color:var(--brand);background:#FDE8E4;border-radius:9px;
  padding:5px 14px;font-weight:700;white-space:nowrap;}
/* 对比列内嵌 SVG 机制图（组件库 .cfig 真值） */
.mvswrap .mfig{margin:10px auto 0;max-width:180px;}
.mvswrap .mfig svg{width:100%;height:auto;display:block;}
/* 金句不上组件：原句内红色强调（内容连贯不打断） */
.em-red{color:var(--brand);}
/* 小节标题：定义区内的什么是X/为什么X结构小节（红字粗体，不套框） */
.abh{font-size:16px;color:var(--brand);margin:18px 0 8px;font-weight:500;}
/* 独立 SVG 结构图容器（hub 中心辐射/阶梯图等） */
.ab-fig{margin:12px auto 0;max-width:560px;}
/* 方法区前置大图（屏蔽力 hub）：放大到接近正文栏宽，保证框内文字接近正文字号 */
.ab-fig + .ab-concepts{margin-top:12px;}
.ab-fig svg{width:100%;height:auto;display:block;}
/* 引用框（如《学会提问》金句）：左侧红条 + 浅红底，不抢主色 */
.quote{border-left:3px solid var(--brand);background:rgba(224,67,46,.05);
  border-radius:0 10px 10px 0;padding:14px 18px;margin:10px 0 2px;}
.quote .qb{font-size:15.5px;line-height:1.85;color:#201914;}
.quote .qsrc{margin-top:10px;font-size:15.5px;color:var(--brand);text-align:right;}
/* 信息金字塔：自顶向下逐层变宽；顶=最可靠一手信息，底=最滞后碎片化信息 */
.ab-pyramid{display:flex;flex-direction:column;align-items:center;gap:7px;margin:14px 0 2px;}
.ab-pyramid .pl{box-sizing:border-box;border:1.5px solid var(--brand);border-radius:9px;
  background:rgba(224,67,46,.05);padding:10px 14px;text-align:center;}
.ab-pyramid .pn{font-size:14.5px;font-weight:700;color:var(--brand);}
.ab-pyramid .px{font-size:13.5px;color:#201914;margin-top:3px;line-height:1.6;}
/* 卡内小对比：组件库 .mini-vs 真值（左列灰底、右列红框，列=标签+陈述；外层不加框——
   卡片本身已有边框，组件库示例里的虚线外框是演示容器，不是组件的一部分） */
.mini-vs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 2px;}
.mini-vs .mcol{border-radius:10px;padding:14px 16px;min-width:0;}
.mini-vs .mcol.l{background:rgba(106,96,88,.08);}
.mini-vs .mcol.r{border:2px solid var(--brand);}
.mini-vs .mt{font-size:15px;color:var(--brand);margin-bottom:8px;letter-spacing:1px;}
.mini-vs .mp{font-size:15px;line-height:1.75;color:#201914;}
/* 道天地将法 / 五事拆解：照搬孙子兵法 .five 真值（红 lab + 关键词 + 原意/现代） */
.five{margin-top:18px;display:grid;grid-template-columns:1fr;gap:10px}
.five .row{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:2px solid var(--abline);border-radius:12px;padding:14px 18px}
.five .lab{flex:0 0 auto;min-width:48px;height:48px;padding:0 9px;border-radius:10px;background:var(--brand);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;font-weight:400;line-height:1.1;text-align:center;white-space:nowrap}

<script>
(function(){
  var tabs = document.querySelector('.nav-tabs');
  function scrollTabIntoView(tab){
    if(!tab || !tabs) return;
    var cw = tabs.clientWidth, sw = tabs.scrollWidth;
    if(sw <= cw) return;
    // 让 active tab 出现在容器左侧约 1/4 处，确保前面一个 tab 也能露出来
    var relLeft = tab.offsetLeft - tabs.offsetLeft;
    var target = relLeft - cw * 0.25;
    tabs.scrollTo({left: Math.max(0, Math.min(target, sw - cw)), behavior: 'smooth'});
  }
  if(tabs){
    var active = tabs.querySelector('.tab.active');
    if(active) setTimeout(function(){ scrollTabIntoView(active); }, 0);
    tabs.addEventListener('click', function(e){
      var t = e.target.closest('.tab');
      if(t) setTimeout(function(){ scrollTabIntoView(t); }, 0);
    });
  }
})();
</script>

<script>
/* 切换能力详情 */
(function(){
  var sections = document.querySelectorAll('.pain-section');
  var links = document.querySelectorAll('.side-nav a[data-target]');
  var groups = document.querySelectorAll('.nav-group');
  function show(id, noScroll, animate){
    if(animate === undefined) animate = true;
    window.__shownId = id;
    try{ sessionStorage.setItem('abmCurrent', id); }catch(e){}
    try{ history.replaceState(null, '', '#' + encodeURIComponent(id)); }catch(e){}
    sections.forEach(function(s){ s.style.display = (s.id === id ? 'block' : 'none'); });
    links.forEach(function(a){
      a.classList.toggle('active', a.getAttribute('data-target') === id);
    });
    if(!noScroll){
      setTimeout(function(){ window.scrollTo(0, 0); }, 0);
    }
    var activeLink = document.querySelector('.side-nav a.active');
    var activeGroup = activeLink ? activeLink.getAttribute('data-group') : null;
    // 首页态（无 hash）所有分组默认折叠，只留维度标题行（对齐成长之路页）；有 hash 才展开所在分组
    groups.forEach(function(g){
      var isActive = g.getAttribute('data-group') === activeGroup;
      var title = g.querySelector('.group-title');
      if(title) title.classList.toggle('active', isActive);
      if(window.innerWidth > 768){
        if(isActive) g.classList.remove('collapsed');
        else g.classList.add('collapsed');
      }
    });
    var cur = document.getElementById(id);
    if(cur && animate){
      var cores = cur.querySelectorAll('.core');
      cores.forEach(function(el, i){
        el.classList.remove('reveal-in');
        void el.offsetWidth;
        setTimeout(function(){ el.classList.add('reveal-in'); }, 60 + i * 90);
      });
    }
  }
  links.forEach(function(a){
    a.addEventListener('click', function(e){
      e.preventDefault ? e.preventDefault() : (e.returnValue = false);
      show(a.getAttribute('data-target'));
      if(window.innerWidth < 900){
        var sideNav = document.getElementById('sideNav');
        var sideOverlay = document.getElementById('sideOverlay');
        if(sideNav) sideNav.classList.remove('open');
        if(sideOverlay) sideOverlay.classList.remove('show');
      }
    });
  });
  var firstGroupNav = document.querySelector('.side-nav .nav-group');
  var firstNavLink = firstGroupNav ? firstGroupNav.querySelector('ul li a') : null;
  var first = firstNavLink ? (firstNavLink.getAttribute('data-target') || firstNavLink.getAttribute('href') || '') : (sections[0] ? sections[0].id : '');
  first = first.replace(/^#/, '');
  var rawHash = window.__savedHash || location.hash || '';
  var hash = rawHash ? decodeURIComponent(rawHash.replace('#','')) : '';
  // 两个动作分开：刷新=URL 带 hash 原地保持；点顶部导航=整页重载且无 hash → 一律回首页（评估优先）
  var target = hash || 'abm-home';
  show(document.getElementById(target) ? target : first, true, false);
  // 顶部导航个人能力模型回首页：详情页点导航 = hash 被清空 = 回 abm-home（与刷新是两个动作，分开处理）
  window.addEventListener('hashchange', function(){
    var h = '';
    try{ h = decodeURIComponent(location.hash.replace('#', '')); }catch(e){ h = location.hash.replace('#', ''); }
    if(!h) h = 'abm-home';
    if(document.getElementById(h) && window.__shownId !== h){
      show(h);
    }
  });
  window.addEventListener('load', function(){ try{ window.scrollTo(0, 0); }catch(e){} });
  function revealFirst(){
    var cur = document.getElementById(window.__shownId);
    if(!cur) return;
    cur.querySelectorAll('.core').forEach(function(el, i){
      setTimeout(function(){ el.classList.add('reveal-in'); }, 30 + i * 70);
    });
  }
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      document.documentElement.classList.remove('preload');
      revealFirst();
    });
  });
  setTimeout(function(){
    var cur = document.getElementById(window.__shownId);
    if(cur && cur.querySelector('.core:not(.reveal-in)')) revealFirst();
  }, 800);
  window.showAbility = show;
})();

/* 移动端侧边栏 */
(function(){
  var menuToggle = document.getElementById('menuToggle');
  var sideNav = document.getElementById('sideNav');
  var sideOverlay = document.getElementById('sideOverlay');
  function openSide(){ if(sideNav){ sideNav.classList.add('open'); sideOverlay && sideOverlay.classList.add('show'); } }
  function closeSide(){ if(sideNav){ sideNav.classList.remove('open'); sideOverlay && sideOverlay.classList.remove('show'); } }
  if(menuToggle){
    function onMenuTap(e){
      e.preventDefault ? e.preventDefault() : (e.returnValue = false);
      e.stopPropagation ? e.stopPropagation() : (e.cancelBubble = true);
      sideNav.classList.contains('open') ? closeSide() : openSide();
    }
    menuToggle.addEventListener('click', onMenuTap);
    menuToggle.addEventListener('touchstart', onMenuTap, {passive:false});
  }
  if(sideOverlay){ sideOverlay.addEventListener('click', closeSide); sideOverlay.addEventListener('touchstart', closeSide, {passive:false}); }
})();

/* 侧边栏手动滚动箭头 */
(function(){
  var scroll = document.getElementById('sideScroll');
  var up = document.getElementById('sideUp');
  var down = document.getElementById('sideDown');
  var hint = document.getElementById('sideHint');
  if(!scroll || !up || !down) return;
  var step = 112;
  var hideTimer = null;
  function showHint(text, isTop){
    if(!hint) return;
    hint.textContent = text;
    hint.className = 'side-hint ' + (isTop ? 'top' : 'bottom');
    requestAnimationFrame(function(){ hint.classList.add('show'); });
    if(hideTimer) clearTimeout(hideTimer);
    hideTimer = setTimeout(function(){ hint.classList.remove('show'); }, 1400);
  }
  function updateArrows(){
    var sh = scroll.scrollHeight, st = scroll.scrollTop, ch = scroll.clientHeight;
    var atTop = st <= 1;
    var atBottom = st + ch >= sh - 1;
    up.disabled = atTop; up.classList.toggle('disabled', atTop);
    down.disabled = atBottom; down.classList.toggle('disabled', atBottom);
  }
  function scrollBy(delta){ scroll.scrollBy({top: delta, behavior: 'smooth'}); }
  up.addEventListener('click', function(){ if(scroll.scrollTop <= 1){ showHint('已到达顶部', true); return; } scrollBy(-step); });
  down.addEventListener('click', function(){ if(scroll.scrollTop + scroll.clientHeight >= scroll.scrollHeight - 1){ showHint('已到达底部', false); return; } scrollBy(step); });
  scroll.addEventListener('scroll', updateArrows, {passive: true});
  /* 有选中/高亮项时，把侧栏滚动到该项可见（尽量居中） */
  var act = scroll.querySelector('a.active');
  if(act){
    var actRect = act.getBoundingClientRect();
    var scRect = scroll.getBoundingClientRect();
    scroll.scrollTop += (actRect.top + actRect.height / 2) - (scRect.top + scRect.height / 2);
  }
  window.addEventListener('load', updateArrows);
  updateArrows();
})();

/* 左侧分组折叠/展开：点一次展开；已展开的再点一次 → 收起 + 取消选中 + 回本页首页 */
(function(){
  document.querySelectorAll('.side-nav .group-title').forEach(function(title){
    title.addEventListener('click', function(e){
      if(e.target.closest('a')) return;
      var g = title.closest('.nav-group');
      if(!g) return;
      // 已经展开：再点一次收起，并且不选中任何一项，直接回首页
      if(!g.classList.contains('collapsed')){
        document.querySelectorAll('.side-nav a.active').forEach(function(a){ a.classList.remove('active'); });
        if(typeof window.showAbility === 'function'){ window.showAbility('abm-home', true); }
        return;
      }
      // 未展开：手风琴展开当前分类、收起其它分类，并选中该分类下第一项能力
      document.querySelectorAll('.nav-group').forEach(function(o){ if(o !== g) o.classList.add('collapsed'); });
      g.classList.remove('collapsed');
      var firstLink = g.querySelector('ul li a');
      var target = '';
      if(firstLink){
        target = firstLink.getAttribute('data-target') || firstLink.getAttribute('href') || '';
      }
      target = target.replace(/^#/, '');
      if(target && typeof window.showAbility === 'function'){
        window.showAbility(target, true);
      }
    });
  });
})();

/* 首页：渲染上一次的评估结果（数据由报告页写入 localStorage） */
(function(){
  var el = document.getElementById('abmLast');
  if(!el) return;
  var raw = null;
  try{ raw = localStorage.getItem('abmLastResult'); }catch(e){ return; }
  if(!raw) return;
  var d = null;
  try{ d = JSON.parse(raw); }catch(e){ return; }
  if(!d || !d.dims || !d.dims.length) return;
  function tier(sc){
    if(sc >= 4.2) return ['lv-1', '#2F9E63'];
    if(sc >= 3.4) return ['lv-2', '#6E9A2E'];
    if(sc >= 2.6) return ['lv-3', '#D9930D'];
    if(sc >= 1.8) return ['lv-4', '#E06A2E'];
    return ['lv-5', '#E0432E'];
  }
  function esc(s){
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function pad2(n){ return n < 10 ? ('0' + n) : ('' + n); }
  var rows = d.dims.map(function(x){
    var t = tier(x.score);
    return '<div class="row">'
      + '<span class="nm">' + esc(x.name) + '</span>'
      + '<span class="sev ' + t[0] + '">' + esc(x.lv) + '</span>'
      + '<span class="sc"><span style="color:' + t[1] + '">' + Number(x.score).toFixed(1) + '</span> / 5.0</span>'
      + '</div>';
  }).join('');
  var when = '';
  if(d.ts){
    var dt = new Date(d.ts);
    when = dt.getFullYear() + '-' + pad2(dt.getMonth() + 1) + '-' + pad2(dt.getDate())
         + ' ' + pad2(dt.getHours()) + ':' + pad2(dt.getMinutes());
  }
  el.innerHTML = '<h2>上一次的评估结果' + (when ? '<span class="when">' + when + '</span>' : '') + '</h2>'
    + rows
    + '<a class="more" href="assessment-report.html?s=' + encodeURIComponent(d.s) + '">查看完整报告 →</a>';
  el.style.display = 'block';
})();
</script>
