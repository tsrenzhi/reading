<script>window.INDEX=[{"name":"一元思维","cat":"思维陷阱","core":false,"file":"yi-yuan-si-wei.html","intro":"拒绝经验照搬，遇事具体问题具体分析","b":"遇到复杂问题的时候，你习惯性只盯着一个点找原因。觉得只要把这个点解决了，事情就搞定了，完全忽略了整件事其实是多重因素共同造成的。 事情可以有主要原因，但几乎没有唯一原因，不要被第一直觉带偏。 就拿孩子成绩下降来说。很多家长第一反应就是怪孩子贪玩，然后就直接靠批评施压。但他们其实忽略了，课程难度是不是变大了？孩子最近是不是有心理压力？学习方法是不是出了问题？如果只盯着“贪玩”这一个点去解决，问题永远都解决不彻底。 一元思维就是遇到问题只能看到一个原因，它会让你遇到复杂问题时，不断踩坑。所以，以后遇到问题时，别急着下结论，先停下来，逼自己找出3个可能的原因，再去动手解决。","sub":"错误的思维方式"},{"name":"二元思维","cat":"思维陷阱","core":false,"file":"er-yuan-si-wei.html","intro":"跳出非黑即白，看清事物利弊共存","b":"看问题的时候，习惯走极端，非黑即白地看问题。要么觉得全都对，要么觉得全都错，完全看不到事情利弊共存的状态。 现实绝大多数事情没有绝对对错，只有适不适合、值不值得。 就拿看待金钱来说。有的人觉得钱是万能的，只要有钱就能解决一切；但有的人又觉得谈钱太俗，钱是肮脏的。这就是典型的二元思维。他们完全看不到，钱在不同的场景下，既能带来自由，也可能带来烦恼，它是有两面性的。 二元思维就是把事情简单分成“好坏”“对错”，但这个世界并不是非黑即白的。所以，下次遇到分歧时，别急着站队，先问自己一句：“这个观点在什么情况下是对的，在什么情况下是错的？”","sub":"错误的思维方式"},{"name":"惯性思维 / 直觉","cat":"思维陷阱","core":false,"file":"guan-xing-si-wei.html","intro":"拒绝经验照搬，遇事具体问题具体分析","b":"遇到问题的时候，习惯性照搬过去的经验，直接靠直觉下判断。这样就不会结合当下的新情况去具体分析了，总是用老套路去解决新问题。 经验可以参考，但不能直接套用。环境一变，老经验大概率失效。 就拿买水果来说。以前我们挑水果，只选外观好看的，习惯性避开有斑点的果子。哪怕后来知道了有些带斑点的水果反而更甜，但一到水果摊，还是改不了固有的挑选习惯，最后总是错失更好的选择。 惯性思维就是遇到事直接套用老办法，不懂得变通。这会导致你掉进自己的思维陷阱里。所以，下次遇到问题时，先想一下：现在的情况，跟以前真的一样吗？","sub":"错误的思维方式"},{"name":"路径依赖","cat":"思维陷阱","core":false,"file":"lu-jing-yi-lai.html","intro":"不困于旧习惯，主动跳出固化做事路径","b":"长期依赖过去熟悉的方法和路径。哪怕这套方法已经低效、落后、不适用了，也不愿意改变，就是不愿意换新方式。 路径依赖不是做错，是低效又不进步。环境变了你还停在原地，落后就是这么一点点攒出来的。 就拿家里的长辈来说。他们一辈子只用现金付款，明明手机支付更便捷、省时，但因为习惯了旧方式，坚决不学新工具。结果呢？不仅自己出门买菜找零麻烦，还经常错过各种线上优惠，无形中增加了生活成本。 路径依赖就是明明老办法已经不行了，还死抱着不放。这会让你跟不上时代的脚步。这需要你定期的复盘和自省，摆脱对旧经验、旧工具的依赖。","sub":"错误的思维方式"},{"name":"线性思维","cat":"思维陷阱","core":false,"file":"xian-xing-si-wei.html","intro":"拒绝简单累加思维，看懂现实的复杂规律","b":"简单认定一个原因就对应一个结果，总觉得付出多少就一定能收获多少。这样就完全忽略了现实中复杂的联动关系，以及各种变量带来的影响。 人生、学习、赚钱都是非线性的，不是累加就必胜，存在波动、瓶颈、突变。 就拿学英语来说。很多人认为每天背10个单词，一年就能学好英语。这就是典型的线性思维。他们只机械地累加数量，却忽略了复习、语法、口语、实际应用这些关键环节。结果呢？背了几千个单词，真遇到老外还是张不开嘴。 线性思维就是，认为只要努力了就一定会有好结果。这就可能会让你在失败时大受打击。所以，在做重要计划时，别只考虑顺利的情况，还要列出至少2个可能导致失败的意外因素，并提前想好应对办法。","sub":"错误的思维方式"},{"name":"绝对思维","cat":"思维陷阱","core":false,"file":"jue-dui-si-wei.html","intro":"摒弃死板定论，学会分场景灵活判断","b":"遇到事情的时候，习惯用绝对、死板的标准去衡量，认定规则和道理永远不会变，完全不接受场景的差异和特殊情况。 所有道理都有适用边界，没有任何一句话、一个规则可以通吃所有场景。 三国里的马谡失街亭就是典型的绝对思维。马谡死守兵书上“居高临下，势如破竹”的教条，不听王平的劝告，非要把军队驻扎在山顶上。他完全没考虑实际地形没有水源这个关键变量，结果被张郃断了水道，全军覆没。把书本上的道理当成永远正确的绝对真理，不看实际情况，这就是绝对思维害死人。 绝对思维就是认定道理永远不会变，不管什么场景都死守一条规则。这会让你在复杂的人际关系和社会环境里处处碰壁。所以，下次遇到事情时，先看看当下的场景，再决定用哪条道理，别一刀切。","sub":"错误的思维方式"},{"name":"学生思维","cat":"思维陷阱","core":false,"file":"xue-sheng-si-wei.html","intro":"告别被动等待，主动思考主动解决问题","b":"遇到问题的时候，习惯等待标准答案，或者等待别人来安排。不会主动去思考、主动去解决问题，过度依赖别人的指导，缺少独立探索的能力。 社会没有统一标准答案，结果导向、解决问题，就是唯一标准。 领导安排了一句“做一份活动方案”，有的新人就不动了。不主动问需求、不查资料、不构思框架，坐在那里等领导逐条教、逐条安排。最后领导觉得他完全没有独立做事的能力，以后重要的活也不敢交给他了。而同期进来的另一个同事，接到同样的任务，先自己查了竞品、列了框架、写了初稿，哪怕做得不完美，领导也愿意继续培养他。 学生思维就是习惯了等别人给答案、等别人安排，不会主动思考和解决问题。这会让你进入职场后极度被动，成长速度远远落后于身边的人。所以，下次遇到问题时，别第一时间等别人来教你，先自己想办法，哪怕想得不完美，也比干等着强。","sub":"错误的思维方式"},{"name":"穷人思维","cat":"思维陷阱","core":false,"file":"qiong-ren-si-wei.html","intro":"拒绝短视消费，学会为长期成长和未来布局","b":"只看重当下的省钱和即时享受，不愿为长远成长和未来收益投入。只顾眼前，没有长期的规划。 省钱攒不下未来，提升能力、积累资源，才能真正改变收入层级。 巴菲特说过一句话：最好的投资就是投资你自己。他年轻的时候，花了一百多美元去上卡耐基的演讲课，这笔钱在当时不算小数目，但这门课帮他克服了公开演讲的恐惧，后来他在股东大会上侃侃而谈的能力，很大程度上就来自那次投入。反观很多人，发了工资第一时间买新款手机、买奢侈品，但让他花几百块学个技能、报个课程，他就舍不得了。只顾当下舒服，结果几年下来，钱没攒下，本事也没长进。 穷人思维就是只盯着眼前的省钱和享乐，不愿意为长远的成长投入。这会让你一直停留在即时消耗的模式里，越忙越穷。所以，下次花钱之前，先问自己一句：这笔钱是花在了享乐上，还是花在了能让自己增值的地方？","sub":"错误的思维方式"},{"name":"弱者思维","cat":"思维陷阱","core":false,"file":"ruo-zhe-si-wei.html","intro":"停止向外抱怨，向内归因主动自救","b":"遇到问题的时候，第一反应就是抱怨外部环境、推卸责任。习惯性示弱、依赖他人，从来不主动找自己的问题，也不主动去破局。 抱怨只会消耗自己，复盘和改变，才能真正解决问题。 项目进度滞后了，有的人不反思自己效率低、方法差，一味抱怨客户多变、同事不配合、时间不够。从来不主动推进、主动补救，最后项目黄了，还觉得全是别人的错。而真正厉害的人，遇到同样的情况，第一反应是：我哪里可以做得更好？哪些环节我可以主动去推动？把能控制的部分先做好，局面往往就扭转了。 弱者思维就是遇到问题第一反应就是抱怨外部环境、推卸责任，从来不找自己的原因。这会让你永远停留在被动受害者的位置上，能力永远无法成长。所以，下次出了问题，先问自己：这件事里，我自己哪里可以做得更好？","sub":"错误的思维方式"},{"name":"打工思维","cat":"思维陷阱","core":false,"file":"da-gong-si-wei.html","intro":"跳出交易心态，把工作当成自我成长的载体","b":"把工作单纯当成换工资的交易。只做分内事、只做给钱的事，拒绝额外的付出，完全不关注自我的成长。 职场短期看薪资，长期看能力，能力到位，收入自然翻倍。 领导安排了一项额外的调研工作，有的人觉得不是分内事、没加班费，就敷衍应付。但他完全看不到，这项调研能帮他积累业务认知和分析能力，这些能力长在他自己身上，以后跳槽、升职都用得上。而那些愿意多做一步的人，表面上看是多干了活，实际上是在用公司的资源给自己攒本事。两三年之后，差距就拉开了。 打工思维就是把工作单纯当成换工资的交易，只做分内事，拒绝额外付出。这会让你长期沦为被动执行的工具人，职场竞争力停滞不前。所以，下次遇到分外的工作时，先想想这件事能不能帮你积累经验、拓展能力，别只盯着眼前的加班费。","sub":"错误的思维方式"},{"name":"伪科学思维","cat":"思维陷阱","core":false,"file":"wei-ke-xue-si-wei.html","intro":"拒绝主观臆断，重要判断必须讲依据","b":"遇到事情的时候，你习惯性只凭感觉、传言或者个人喜好来做判断，根本不去查证客观事实和真实依据，特别容易相信那些没有根据的信息。 听起来好听、符合自己预期的话，大概率是谣言，越舒服越要警惕。 之前网上流传“喝碱性水能防癌”的说法，很多人连基本的医学依据都不去查，就直接花高价购买了所谓的碱性水设备，还强迫家人每天喝。结果钱白白浪费了，身体也没得到任何好处。 伪科学思维就是遇到问题只凭感觉和传言做判断，不去查证事实。这会让你轻易被谣言误导。所以，遇到涉及健康或钱财的大事，先去查查权威依据，别听风就是雨。","sub":"错误的思维方式"},{"name":"结构化思维","cat":"顶级思维模型","core":true,"file":"jie-gou-hua-si-wei.html","intro":"先定目标，再搭不重不漏的框架","t":"常见痛点 实操落地步骤 误区边界 总结提示 MECE 相互独立 完全穷尽","m":"思考混乱 抓不住重点 表达条理不清 没有稳定主线 以终为始 目标导向 过度拆分","b":"明确最终目标 统一拆分标准 搭建顶层框架 复盘迭代 衣柜规整"},{"name":"第一性原理","cat":"顶级思维模型","core":true,"file":"di-yi-xing-yuan-li.html","intro":"抛开经验，从底层事实重新推导","t":"常见痛点 实操落地步骤 误区边界 总结提示 从零推导","m":"经验依赖 认知片面 解决低效 固有认知 类比照搬 底层事实","b":"清空固有认知 深挖底层事实 重构可行方案 5Why 马斯克 电池成本 否定经验"},{"name":"辩证思维","cat":"顶级思维模型","core":true,"file":"bian-zheng-si-wei.html","intro":"打破非黑即白，多角度看清问题","t":"常见痛点 实操落地步骤 误区边界 总结提示 对立统一 发展 矛盾 质疑","m":"非黑即白 绝对化 道德绑架 吃亏 站队 认知局限 环境变化 左右摇摆","b":"摒弃二元思维 发展视角 矛盾双向 理性质疑 吃亏是福"},{"name":"逻辑思维","cat":"顶级思维模型","core":true,"file":"luo-ji-si-wei.html","intro":"从经历中找规律，用规律做决定","t":"常见痛点 实操落地步骤 误区边界 总结提示 归纳法 演绎法","m":"减少情绪直觉错误判断 总结靠谱规律 自我复盘 决策出错 情绪内耗 底层原因 辩论抬杠","b":"事实收集 总结规律 匹配现状 推导方案 验证迭代 归纳汇聚 演绎发散 作息精力"},{"name":"抽象思维","cat":"顶级思维模型","core":true,"file":"chou-xiang-si-wei.html","intro":"遇事聚焦主要矛盾，从多件事件提炼共性，总结可迁移的通用规律","t":"常见痛点 实操落地步骤 误区边界 总结提示 聚焦主要矛盾 寻找共性 通用规律","m":"经验复用 信息判断 复盘总结 次要细节 主要矛盾 同类事件 沉淀规律","b":"复盘真实事件 聚焦主要矛盾 寻找共性 总结通用规律 客户沟通 交付节点 时间节点"},{"name":"系统思维","cat":"顶级思维模型","core":true,"file":"xi-tong-si-wei.html","intro":"看清事物之间的连接与反馈","t":"常见痛点 实操落地步骤 误区边界 总结提示 连接 反馈回路 杠杆点 系统结构","m":"救火式应对 归因片面 忽视延迟 只见树木 牵一发而动全身 局部最优 整体视角","b":"识别关键要素 梳理连接关系 找到反馈回路 预判系统走向 增强回路 调节回路 团队业绩 客户留存"},{"name":"批判性思维","cat":"顶级思维模型","core":true,"file":"pi-pan-xing-si-wei.html","intro":"不盲信，自带质疑判断信息","t":"常见痛点 实操落地步骤 误区边界 总结提示 质疑 独立判断 论证逻辑 信息来源","m":"轻信盲从 确认偏误 逻辑漏洞 同温层 被带节奏 智商税 以偏概全 相关当因果","b":"暂停直觉结论 核查信息来源 检验论证逻辑 形成独立判断 补反面证据 食疗包治百病 营销话术"},{"name":"逆向思维","cat":"顶级思维模型","core":true,"file":"ni-xiang-si-wei.html","intro":"反过来想，先排除失败的可能","t":"常见痛点 实操落地步骤 误区边界 总结提示 反过来想 倒推 排除失败 排雷","m":"正面卡死 盲区漏坑 盲目乐观 顺向撞墙 预演失败 风险预案 反向推导 避坑","b":"明确想要结果 倒推失败路径 排除致命风险 锁定可行方案 跳槽创业公司 最坏结果 行动顺序"}];window.CORE_HTML="<a class=\"model done\" href=\"models/jie-gou-hua-si-wei.html\"><div class=\"m-head\"><span class=\"name\">结构化思维</span></div><div class=\"m-val\">先定目标，再搭不重不漏的框架</div><div class=\"m-foot\"><span class=\"m-cta\">查看详情<svg class=\"cta-arrow\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12h14M12 5l7 7-7 7\"/></svg></span></div></a>\n<a class=\"model done\" href=\"models/di-yi-xing-yuan-li.html\"><div class=\"m-head\"><span class=\"name\">第一性原理</span></div><div class=\"m-val\">抛开经验，从底层事实重新推导</div><div class=\"m-foot\"><span class=\"m-cta\">查看详情<svg class=\"cta-arrow\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12h14M12 5l7 7-7 7\"/></svg></span></div></a>\n<a class=\"model done\" href=\"models/bian-zheng-si-wei.html\"><div class=\"m-head\"><span class=\"name\">辩证思维</span></div><div class=\"m-val\">打破非黑即白，多角度看清问题</div><div class=\"m-foot\"><span class=\"m-cta\">查看详情<svg class=\"cta-arrow\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12h14M12 5l7 7-7 7\"/></svg></span></div></a>\n<a class=\"model done\" href=\"models/luo-ji-si-wei.html\"><div class=\"m-head\"><span class=\"name\">逻辑思维</span></div><div class=\"m-val\">从经历中找规律，用规律做决定</div><div class=\"m-foot\"><span class=\"m-cta\">查看详情<svg class=\"cta-arrow\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12h14M12 5l7 7-7 7\"/></svg></span></div></a>\n<a class=\"model done\" href=\"models/chou-xiang-si-wei.html\"><div class=\"m-head\"><span class=\"name\">抽象思维</span></div><div class= <script>
var menuToggle = document.getElementById('menuToggle');
var sideNav = document.getElementById('sideNav');
var sideOverlay = document.getElementById('sideOverlay');
function openSide(){ if(sideNav){ sideNav.classList.add('open'); sideOverlay && sideOverlay.classList.add('show'); } }
function closeSide(){ if(sideNav){ sideNav.classList.remove('open'); sideOverlay && sideOverlay.classList.remove('show'); } }
if(menuToggle){
  function onMenuTap(e){
    e.preventDefault ? e.preventDefault() : (e.returnValue = false);
    e.stopPropagation ? e.stopPropagation() : (e.cancelBubble = true);
    sideNav.classList.contains('open') ? closeSide() : openSide();
  }
  menuToggle.addEventListener('click', onMenuTap);
  menuToggle.addEventListener('touchstart', onMenuTap, {passive:false});
}
if(sideOverlay){ sideOverlay.addEventListener('click', closeSide); sideOverlay.addEventListener('touchstart', closeSide, {passive:false}); }
/* 点击侧边栏链接后，移动端自动关闭抽屉 */
var sideLinks = document.querySelectorAll('.side-nav a');
sideLinks.forEach(function(a){ a.addEventListener('click', function(){ if(window.innerWidth <= 900) closeSide(); }); });

/* 侧边栏手动滚动箭头 */
(function(){
  var scroll = document.getElementById('sideScroll');
  var up = document.getElementById('sideUp');
  var down = document.getElementById('sideDown');
  var hint = document.getElementById('sideHint');
  if(!scroll || !up || !down) return;
  var step = 112;
  var hideTimer = null;
  function showHint(text, isTop){
    if(!hint) return;
    hint.textContent = text;
    hint.className = 'side-hint ' + (isTop ? 'top' : 'bottom');
    requestAnimationFrame(function(){ hint.classList.add('show'); });
    if(hideTimer) clearTimeout(hideTimer);
    hideTimer = setTimeout(function(){ hint.classList.remove('show'); }, 1400);
  }
  function updateArrows(){
    var sh = scroll.scrollHeight, st = scroll.scrollTop, ch = scroll.clientHeight;
    var atTop = st <= 1;
    var atBottom = st + ch >= sh - 1;
    up.disabled = atTop;
    up.classList.toggle('disabled', atTop);
    down.disabled = atBottom;
    down.classList.toggle('disabled', atBottom);
  }
  function scrollBy(delta){
    scroll.scrollBy({top: delta, behavior: 'smooth'});
  }
  up.addEventListener('click', function(){
    if(scroll.scrollTop <= 1){ showHint('已到达顶部', true); return; }
    scrollBy(-step);
  });
  down.addEventListener('click', function(){
    if(scroll.scrollTop + scroll.clientHeight >= scroll.scrollHeight - 1){ showHint('已到达底部', false); return; }
    scrollBy(step);
  });
  scroll.addEventListener('scroll', updateArrows, {passive: true});
  /* 有选中分类时，把侧栏滚动到选中项可见（尽量居中），避免选中最底部分类时高亮在可视区外 */
  var act = scroll.querySelector('a.active');
  if(act){
    var actRect = act.getBoundingClientRect();
    var scRect = scroll.getBoundingClientRect();
    scroll.scrollTop += (actRect.top + actRect.height / 2) - (scRect.top + scRect.height / 2);
  }
  window.addEventListener('load', updateArrows);
  updateArrows();
})();

/* 全局流程图悬停提示：避免被 .flow-scroll 的 overflow-x 裁剪 */
(function(){
  var globalTip = document.createElement('div');
  globalTip.id = 'global-tip';
  globalTip.className = 'global-tip';
  document.body.appendChild(globalTip);
  var activeNode = null;

  function positionTip(node){
    var tip = node.querySelector('.tip');
    if(!tip) return false;
    globalTip.innerHTML = tip.innerHTML;
    var rect = node.getBoundingClientRect();
    var vw = window.innerWidth || document.documentElement.clientWidth;
    // H5 下限制 tip 最大宽度，避免溢出屏幕
    if(vw <= 720){
      globalTip.style.maxWidth = Math.max(180, vw - 32) + 'px';
    }else{
      globalTip.style.maxWidth = '320px';
    }
    globalTip.style.width = 'auto';
    var tipRect = globalTip.getBoundingClientRect();
    var top = rect.top - tipRect.height - 10;
    var center = rect.left + rect.width/2;
    var left = center - tipRect.width/2;
    var minLeft = 16;
    var maxLeft = vw - tipRect.width - 16;
    if(maxLeft < minLeft){ maxLeft = minLeft; }
    if(left < minLeft) left = minLeft;
    if(left > maxLeft) left = maxLeft;
    globalTip.style.left = left + 'px';
    globalTip.style.top = top + 'px';
    globalTip.style.transform = 'none';
    return true;
  }

  function showTip(node){
    if(positionTip(node)){
      activeNode = node;
      globalTip.classList.add('show');
    }
  }

  function hideTip(){
    activeNode = null;
    globalTip.classList.remove('show');
  }

  document.body.addEventListener('mouseover', function(e){
    var node = e.target.closest('.node');
    if(node) showTip(node);
  });
  document.body.addEventListener('mouseout', function(e){
    var node = e.target.closest('.node');
    if(node && activeNode === node) hideTip();
  });

  /* 移动端：点击节点切换提示 */
  document.body.addEventListener('click', function(e){
    var node = e.target.closest('.node');
    if(!node) return;
    if(activeNode === node){ hideTip(); }
    else { showTip(node); }
  });

  window.addEventListener('scroll', hideTip, {passive:true});
  window.addEventListener('resize', hideTip);
})();

/* 回环反馈线：按流程图首尾节点的实际位置动态绘制，宽度随内容自适应 */
(function(){
  function drawLoops(){
    var wraps = document.querySelectorAll('.loop-wrap');
    for(var i=0;i<wraps.length;i++){
      var lw = wraps[i];
      var svg = lw.querySelector('svg');
      if(!svg) continue;
      var path = svg.querySelector('path[marker-end]');
      var text = svg.querySelector('text');
      var sec = lw.closest('section') || lw.parentElement;
      var flow = sec ? sec.querySelector('.flow') : null;
      if(!path || !flow) continue;
      var nodes = flow.querySelectorAll('.node');
      if(nodes.length < 2) continue;
      var base = svg.getBoundingClientRect();
      if(base.width < 60) continue;
      var fr = nodes[0].getBoundingClientRect();
      var lr = nodes[nodes.length-1].getBoundingClientRect();
      var L = fr.left + fr.width/2 - base.left;
      var R = lr.left + lr.width/2 - base.left;
      var pad = 14;
      L = Math.max(pad, Math.min(L, base.width - pad));
      R = Math.max(pad + 40, Math.min(R, base.width - pad));
      if(R - L < 60) continue;
      svg.setAttribute('viewBox', '0 0 ' + Math.round(base.width) + ' 76');
      path.setAttribute('d', 'M' + R + ' 14 V44 Q' + R + ' 52 ' + (R-8) + ' 52 H' + (L+8) + ' Q' + L + ' 52 ' + L + ' 44 V18');
      if(text) text.setAttribute('x', (L + R) / 2);
    }
  }
  window.addEventListener('load', drawLoops);
  window.addEventListener('resize', drawLoops);
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(drawLoops); }
  setTimeout(drawLoops, 60);
})();
</script>
