<script>window.INDEX=[{"name": "奖励和惩罚超级反应倾向", "cat": "思维陷阱", "core": false, "file": "jiang-li-he-cheng-fa-qing-xiang.html", "intro": "警惕短期快感绑架长期目标", "b": "你很容易被眼前的即时好处刺激，为了短期的利益就冲动地去做事；同时也会因为害怕受到惩罚，刻意去回避那些正确但是很痛苦的事情。 别人可以利用奖励操控你的行为，而你自己也要警惕被短期快感牵着走。 比如你明明计划好了要减肥，但是刷短视频、吃零食可以立刻让你获得快乐。于是你一次次放弃了去运动，任由这种短期的快感，彻底打乱了你原本设定的长期目标。 奖励和惩罚超级反应倾向，就是容易被眼前的短期刺激带着走，从而牺牲长期目标。这会让你被外界轻易操控。所以，遇到诱惑时先停下来想想长期后果，用内在目标来主导自己的行动。", "sub": "人类误判心理倾向"}, {"name": "喜欢 / 热爱倾向", "cat": "思维陷阱", "core": false, "file": "xi-huan-re-ai-qing-xiang.html", "intro": "不要因为偏爱，自动忽略潜在缺陷", "b": "只要你特别喜欢一个人或者一件事物，你就会自动忽略它身上存在的缺点，盲目地去美化对方，最后彻底丧失客观的判断力。 喜欢属于情绪，而判断需要理性，二者可以共存，我们不能直接让情绪代替理性判断。 之前因为十分信任一位朋友，当对方提出合伙投资项目的时候，自己根本没有去核查项目存在的风险，就直接投入了资金。最后因为项目本身的漏洞，导致了严重的亏损。 喜欢或热爱倾向，就是会因为偏爱而自动忽略缺点，丧失客观判断力。这会让你对潜在隐患视而不见，最终来不及补救。所以，面对特别喜欢的人或事，强迫自己主动找找它的缺点，并多听听第三方的客观意见。", "sub": "人类误判心理倾向"}, {"name": "讨厌 / 憎恨倾向", "cat": "思维陷阱", "core": false, "file": "tao-yan-zeng-hen-qing-xiang.html", "intro": "区分人和观点，不能因反感全盘否定", "b": "一旦你反感某个人或者某件事，你就会下意识地全盘否定对方。哪怕对方提出了合理的观点，你也不愿意去接纳。 就算是我们反感的人，也有可能说出正确的道理；而我们认可的好人，也有可能犯下错误，不能一刀切。 比如你和某个同事闹过矛盾之后，哪怕对方后来提出了一个可以提升整体效率的好方案，你内心也会下意识地产生抵触，根本不愿意去采纳。 讨厌或憎恨倾向，就是会因为反感某个人，而下意识全盘否定对方提出的合理观点。这会让你错过可行的解决方案，还不断激化矛盾。所以，遇到讨厌的人提出的观点，先区分是讨厌人还是反对观点，单独评判观点本身。", "sub": "人类误判心理倾向"}, {"name": "避免怀疑倾向", "cat": "思维陷阱", "core": false, "file": "bi-mian-huai-yi-qing-xiang.html", "intro": "接纳短暂不确定，拒绝仓促下结论", "b": "你内心很难忍受长时间犹豫不决的状态，迫切地想要快速下定结论。就算手里的证据并不充足，你也非要立刻给出一个答案。 暂时搁置问题，不等于直接放弃思考；很多问题，随着时间推移会出现新的线索。 之前只看到网上一段碎片化的爆料，根本没有去查证完整的事实经过，就立刻在网上站队、发表结论。等到后续剧情反转的时候，才发现自己当初的判断实在太早了。 避免怀疑倾向，就是很难忍受犹豫不决，在证据不足时也非要立刻给出答案。这会让你在信息不足时仓促决定，埋下大量隐患。所以，面对重要问题，给自己设置一段冷静期，允许自己暂时“没有答案”，等收集到足够信息再判断。", "sub": "人类误判心理倾向"}, {"name": "避免不一致性倾向", "cat": "思维陷阱", "core": false, "file": "bi-mian-bu-yi-zhi-qing-xiang.html", "intro": "不要为了面子，硬守住错误选择", "b": "为了维护自己以前说过的话或者做过的选择，就算发现原来的想法存在错误，也不愿意推翻旧观点，强行维持前后想法一致。 坚持错误并不是专一，而及时调整方向，才属于理性行为。 你买了一只基金，明明已经跌了百分之三十，各种利空消息出来，但你就是不愿意割肉，反而继续加仓想摊低成本。你总想着“等回本就卖”，结果越套越深，最后本金亏掉了一大半。 避免不一致性倾向，就是明明知道错了，为了面子和沉没成本还要硬撑。这会让你在错误的路上越错越深。所以，下次发现方向不对时，先抛开过去的投入，问问自己现在还会不会这么选，该止损就果断止损。", "sub": "人类误判心理倾向"}, {"name": "好奇心倾向", "cat": "思维陷阱", "core": false, "file": "hao-qi-xin-qing-xiang.html", "intro": "管控漫无目的猎奇，保护核心注意力", "b": "你本能地对新鲜猎奇的内容充满兴趣，很容易被碎片化的八卦和刺激性信息牵着注意力，最后耽误了手头的正事。 好奇心可以用来帮助我们学习新知识，但是我们不能任由好奇心漫无目的地四处游走。 你本来打算周末写一份重要的报告，结果刚打开电脑，手机弹出一个明星八卦的推送。你想着就看五分钟，结果顺着链接一路吃瓜，两个小时过去了，报告连个文档都没新建。 好奇心倾向，就是容易被无意义的八卦和猎奇信息牵着鼻子走，浪费大量时间。这会让你正事拖延，注意力涣散。所以，下次想点进那些猎奇链接时，先定个闹钟，把吃瓜时间留到做完正事之后。", "sub": "人类误判心理倾向"}, {"name": "追求公平倾向", "cat": "思维陷阱", "core": false, "file": "gong-ping-qing-xiang.html", "intro": "放下对即时绝对公平的执念，着眼长期收益", "b": "你本能地追求绝对公平，一旦感觉待遇不公平，就心生不满，甚至不惜放弃自身利益，也要追求对等报复。 很难做到每一件事的收益立刻一模一样，而长期收益，比一时均等更加重要。 在公司做项目，你觉得同事干的活比你少，但拿的奖金跟你一样多。你一气之下直接摆烂，什么都不干了，结果项目黄了，你的绩效也拿了最低。为了争一口气，反而坑了自己。 追求公平倾向，就是眼里揉不得沙子，一觉得不公平就赌气摆烂。这会让你为了争一口气，搭上自己的长期利益。所以，下次觉得分配不公时，先算算自己的核心利益是什么，别用别人的错误来惩罚自己。", "sub": "人类误判心理倾向"}, {"name": "艳羡 / 妒忌倾向", "cat": "思维陷阱", "core": false, "file": "yan-xian-du-ji-qing-xiang.html", "intro": "停止横向攀比内耗，专注自己的成长节奏", "b": "看到身边人获得财富、机遇或者成就之后，你内心产生不平衡，不愿意静下心提升自己，反而盯着别人的生活进行精神内耗。 别人的成果属于别人，而你的赛道和节奏，不需要和所有人保持一致。 你看到前同事跳槽涨了百分之五十的工资，心里很不是滋味，于是盲目跟风去投那些自己根本不擅长的高薪岗位。结果面试屡屡碰壁，连原本稳定的工作也干不进去了。 艳羡和妒忌倾向，就是看到别人过得好就心态失衡，把精力全花在攀比上。这会让你打乱自己的节奏，越比越焦虑。所以，下次再看到别人晒成绩时，立刻关掉手机，回头看看自己今天比昨天进步了没有。", "sub": "人类误判心理倾向"}, {"name": "回馈倾向", "cat": "思维陷阱", "core": false, "file": "hui-kui-qing-xiang.html", "intro": "守住个人边界，避免被人情恩惠绑架", "b": "当别人给予你一点小恩惠的时候，你会产生强烈的亏欠感，急于超额回报对方；当别人恶意对待你的时候，你也总想立刻报复回去。 很多销售人员，就是利用赠送小礼品的方式，触发你的回馈心理，促使你下单。 去超市逛的时候，导购大姐特别热情，硬塞给你一堆免费试吃的小样，还帮你提东西。你心里觉得过意不去，明明根本不需要她推销的那套昂贵化妆品，最后还是刷信用卡买了一单。 回馈倾向，就是别人给点好处就觉得亏欠，立刻想加倍还回去，结果被人情绑架。这会让你做出很多违背自身利益的决定。所以，下次再遇到别人热情推销或者送小恩小惠时，先在心里默数十秒，想清楚自己是真需要，还是只想还人情。", "sub": "人类误判心理倾向"}, {"name": "受简单联想影响的倾向", "cat": "思维陷阱", "core": false, "file": "jian-dan-lian-xiang-qing-xiang.html", "intro": "区分巧合和因果，拒绝强行关联", "b": "遇到两件事先后发生的时候，你下意识就会认定它们之间有因果关系。仅仅依靠表面的联想就得出结论，而不去深究背后真实的逻辑。 两件事先后发生，不等于二者一定存在因果。 比如打麻将或者玩游戏的时候，你刚好穿了一件新衣服，并且赢了一把。你下意识就会认定这件衣服是“幸运战袍”。以后每次想赢，你都要穿它，把一次偶然的巧合，当成了必然的规律。 受简单联想影响的倾向，就是看到两件事先后发生，就强行把它们绑定成因果关系。这会让你总结出错误的经验，导致持续出错。所以，下次遇到巧合时，先问自己还有没有其他变量，别急着把偶然当规律。", "sub": "人类误判心理倾向"}, {"name": "简单的、避免痛苦的心理否认", "cat": "思维陷阱", "core": false, "file": "bi-mian-tong-ku-qing-xiang.html", "intro": "拒绝长期逃避，接纳现实再解决问题", "b": "当现实过于残酷、让人感到痛苦的时候，你会下意识地拒绝承认事实。假装坏事根本没有发生，用这种方式来逃避内心的痛苦。 心理否认只能做到短期止痛，但是不能真正解决问题。 比如公司已经发现核心业务的数据在持续下滑，但管理者不愿意承认危机已经到来。他们假装一切正常，依旧维持原来的经营策略，不去做任何调整，直到资金链断裂、局面彻底失控。 简单的心理否认，就是面对残酷现实时假装坏事没发生，用来逃避痛苦。这会让问题持续恶化，错过最佳处理时机。所以，允许自己短暂缓冲后，必须设定截止时间，强迫自己直面问题并制定方案。", "sub": "人类误判心理倾向"}, {"name": "自视过高的倾向", "cat": "思维陷阱", "core": false, "file": "zi-shi-guo-gao-qing-xiang.html", "intro": "客观评估自身能力，不要盲目乐观", "b": "你习惯性高估自己的能力和判断力，觉得自己的水平远高于大多数普通人。同时，你会严重低估做事过程中潜在的各种风险。 绝大多数人，都认为自己的能力处于中上水平，这本身就是一种认知错觉。 比如一个新手刚进入股票交易市场，看了几本书，就觉得自己悟性远超普通散户。他没有经过系统的学习和模拟，就直接投入大额资金，结果遇到市场波动，最终出现大额亏损。 自视过高，就是习惯性高估自己的能力，同时低估潜在的风险。这会让你盲目自信，在重大选择里高估成功概率而栽跟头。所以，评估成功率时主动下调乐观预估，并认真听取别人的负面意见。", "sub": "人类误判心理倾向"}, {"name": "过度乐观倾向", "cat": "思维陷阱", "core": false, "file": "guo-du-le-guan-qing-xiang.html", "intro": "美好期待之外，预留风险预案", "b": "你习惯性对未来的结果往最好的方向想象，只去畅想一切顺利的情景，却完全忽略了各类阻碍和意外带来的风险。 做事情可以抱着最好的期待，同时也要做好最坏情况的预案。 比如做创业规划的时候，你只计算了一切顺利情况下的盈利预期，完全没有预留应对亏损的现金流。结果遇到市场波动，业务开展不顺，资金链直接断裂，公司被迫倒闭。 过度乐观倾向，就是只畅想一切顺利的情景，完全忽略意外带来的风险。这会让你的计划在遇到意外时直接崩盘。所以，制定计划后必须梳理 3 个失败原因，并预留缓冲时间和备用方案。", "sub": "人类误判心理倾向"}, {"name": "被剥夺超级反应倾向", "cat": "思维陷阱", "core": false, "file": "bei-bo-duo-chao-ji-fan-ying-qing-xiang.html", "intro": "警惕损失厌恶情绪，敢于理性止损", "b": "当自己已经拥有的东西即将失去的时候，你的情绪会剧烈放大。为了守住原有的利益，你会做出很多不理性的举动。 丢掉100元的痛苦，往往大于捡到100元带来的开心。 比如你买的基金或股票已经开始持续下跌，你内心完全无法接受账面上的亏损。你不愿意卖出止损，反而一路死扛持有，甚至继续加仓，直到最后深度套牢，损失惨重。 被剥夺超级反应倾向，就是即将失去已有东西时情绪剧烈放大，为了守住利益做出不理性举动。这会让你因为害怕损失而死扛，在变差的事情上持续加码。所以，遇到这种情况先分清是舍不得还是怕失去，并重新评估当下的真实价值。", "sub": "人类误判心理倾向"}, {"name": "社会认同倾向", "cat": "思维陷阱", "core": false, "file": "she-hui-ren-tong-qing-xiang.html", "intro": "拒绝无脑跟风，大众行为不等于正确", "b": "遇到事情的时候，你习惯性去看周围大多数人是怎么做的。只要大家都在干，你就默认这事没问题，直接跟着干。 就算多数人一起犯错，错误也不会因此直接变成正确。 前几年虚拟货币特别火的时候，你身边好几个朋友都在晒收益，你连区块链是什么都没搞明白，就怕自己错过这波红利，直接借钱冲进去。结果没过几个月，项目直接暴雷，本金全打了水漂。 社会认同倾向就是看大家都在做什么，你就跟着做什么。这会让你丧失独立判断，跟着集体踩坑。所以，下次看到全网都在跟风某件事时，先停下来查查它背后的逻辑，别别人冲你就冲。", "sub": "人类误判心理倾向"}, {"name": "对比错误反应倾向", "cat": "思维陷阱", "core": false, "file": "dui-bi-cuo-wu-fan-ying-qing-xiang.html", "intro": "以自身需求为准，不被参照物诱导", "b": "判断一个东西值不值的时候，你不去看它本身的真实价值，而是习惯拿它和旁边的东西做对比，最后得出一个失真的感受。 商家经常摆放一款高价产品作为“参照物”，让第二款商品看起来性价比很高。 你去买西装，本来只想花两千块买套基础款。结果导购直接带你去看两万块的顶配款，然后告诉你现在有一万块的中档款在打折。你一对比，觉得一万块比两万块划算太多了，于是脑子一热，超出了原本两千块的预算直接刷卡。 对比错误反应倾向就是不看东西本身的价值，只靠跟旁边的东西对比来做决定。这会让你被参照物干扰，花冤枉钱。所以，下次做决定前，先捂住眼睛别看参照物，问问自己原本的需求和预算到底是什么。", "sub": "人类误判心理倾向"}, {"name": "压力影响倾向", "cat": "思维陷阱", "core": false, "file": "ya-li-ying-xiang-qing-xiang.html", "intro": "重大决策避开情绪高压峰值", "b": "当你的心理压力急剧增大、快要扛不住的时候，你的理智和判断力会明显下降。这时候你很容易本能地冲动行事，甚至听信一些迷信说法，做出极端的选择。 适度压力可以提升做事效率，但是巨大压力，会直接削弱我们的理性。 你最近生意失败，背负了高额的债务，每天一睁眼就是催收电话，内心极度焦虑。这时候有人给你推荐一个“保证月息百分之二十、快速回本”的理财项目，你连合同都没看清，为了赶紧翻本就借了高利贷投进去，结果不仅没回本，反而背上了更重的债。 压力影响倾向就是人在极度高压下，理智会掉线，容易做出冲动和极端的决定。这会让你在重压下病急乱投医，事后后悔。所以，当你觉得压力大到快崩溃时，什么都别决定，先睡一觉或者去跑个步，等脑子清醒了再说。", "sub": "人类误判心理倾向"}, {"name": "错误衡量易得性倾向", "cat": "思维陷阱", "core": false, "file": "cuo-wu-heng-liang-yi-de-xing-qing-xiang.html", "intro": "高频可见信息，不等于最重要信息", "b": "只要是那些容易获得、或者你经常看到的信息，你就会下意识地高估它的重要程度。相反，那些难以获取、不常看到的信息，就会直接被你的大脑忽略掉。 新闻天天报道的事故，发生概率未必最高，只是它更容易传播。 你最近刷短视频，连续看了十几个“做自媒体副业月入过万”的案例。你下意识就觉得做副业很容易赚钱，高估了成功的概率，直接辞职全职干。但你忽略了，短视频只推送那些成功的极少数，绝大多数做自媒体的人，其实连电费都赚不回来。 错误衡量易得性倾向就是觉得容易看到的信息，就是最重要的信息。这会让你被高频曝光的表象带偏，忽略真正关键的风险。所以，下次做决定前，别光看网上天天推送的案例，主动去查查那些没发声的失败者的数据。", "sub": "人类误判心理倾向"}, {"name": "不用就忘倾向", "cat": "思维陷阱", "core": false, "file": "bu-yong-jiu-wang-qing-xiang.html", "intro": "知识要定期复盘输出，避免闲置遗忘", "b": "你学到的新知识、新思考方法，如果长期搁置在脑子里不用，大脑就会慢慢把它遗忘。等到你真正需要使用的时候，根本想不起来，也调取不出来。 知识只有反复调用，才能真正变成属于我们自己的能力。 你花了好几千块钱，报了一个职场谈判沟通的训练营，当时觉得学到了好多干货。但学完之后，你在日常工作里还是按老习惯沟通，从来不去刻意练习。半年后，当你真的需要去跟老板谈加薪的时候，脑子里只剩下几个模糊的名词，根本用不上。 不用就忘倾向就是学了一堆东西却从来不用，最后大脑自动把它们清理掉。这会让你白白浪费学习时间，关键时刻拿不出真本事。所以，学完一个新方法后，这周内必须找件事用它一次，用过的知识才是你自己的。", "sub": "人类误判心理倾向"}, {"name": "化学物质错误影响倾向", "cat": "思维陷阱", "core": false, "file": "hua-xue-wu-zhi-cuo-wu-ying-xiang-qing-xiang.html", "intro": "意识受干扰时，暂停重大决策", "b": "在酒精、药物等物质影响下，人的自控力会明显变弱，很容易做出清醒状态下绝对不会做的冲动行为。 醉酒之后展现出来的性格，是约束消失之后的本能，不能全部当作借口。 比如，平时性格挺温和的人，几杯酒下肚后情绪上头，在微信群里发了过激的言论。等第二天酒醒了想撤回，发现已经超过时间，只能硬着头皮去道歉，给自己带来了严重的人际关系危机。 化学物质错误影响倾向，就是人在意识受干扰时，自控力会断崖式下跌。所以，喝酒或服药后，唯一要做的就是拒绝处理任何重大事项，别给自己挖坑。", "sub": "人类误判心理倾向"}, {"name": "衰老错误影响倾向", "cat": "思维陷阱", "core": false, "file": "shuai-lao-ying-xiang-qing-xiang.html", "intro": "终身保持开放心态，持续接纳新知", "b": "随着年龄增长，一部分人接受新事物的速度会变慢。他们习惯固守老旧观念，排斥新知识，导致思维更新的能力出现明显下降。 衰老不等于认知僵化，终身学习，可以延缓思维固化。 比如，有些长辈一听到“线上办公”或“线上获客”，连运行逻辑都不去了解，直接就认定这些全都是骗局。他们宁愿守着传统的线下模式，也不愿意尝试新的工具，最后导致生意越来越难做。 衰老错误影响倾向，就是人容易因为精力下降而拒绝接受新事物。所以，年龄增长的同时，更要刻意保持开放的学习心态，别让自己的经验变成束缚自己的枷锁。", "sub": "人类误判心理倾向"}, {"name": "权威错误影响倾向", "cat": "思维陷阱", "core": false, "file": "quan-wei-cuo-wu-ying-xiang-qing-xiang.html", "intro": "尊重权威，拒绝无脑盲从", "b": "习惯性信任专家、大佬、领导这类拥有权威身份的人。只要对方给出观点，自己就默认内容绝对正确，直接放弃独立核验。 权威观点可以提高参考权重，但是不能直接作为最终判定依据。 比如，看到某位财经大V推荐一款理财产品，很多人连底层资产是什么都不去核查，觉得大V推荐肯定靠谱，直接买入。结果产品暴雷，大V早就全身而退，只有普通投资者承担了巨额亏损。 权威错误影响倾向，就是人容易因为对方的身份光环而放弃思考。所以，尊重权威的同时，必须保留自己独立核验的权利，别把脑子交给别人。", "sub": "人类误判心理倾向"}, {"name": "废话倾向", "cat": "思维陷阱", "core": false, "file": "fei-hua-qing-xiang.html", "intro": "决策沟通聚焦核心，减少无效表达", "b": "单纯为了表达或刷存在感，输出大量没有实际价值的闲聊观点，这会严重耽误自己和他人的决策效率。 闲聊娱乐可以用来放松，但是在决策场景里，我们要尽量剔除废话。 比如，在开会讨论方案的时候，有些人为了刷存在感，发表了大量无关的感慨和废话。这导致核心问题迟迟无法推进，会议严重超时，最后大家散会时，依然没有得出任何有效的结论。 废话倾向，就是人为了刷存在感而输出无效信息。所以，一定要分清闲聊场景和决策场景，在重要沟通时，强迫自己只聚焦核心问题。", "sub": "人类误判心理倾向"}, {"name": "重视理由倾向", "cat": "思维陷阱", "core": false, "file": "zhong-shi-li-you-qing-xiang.html", "intro": "不被似是而非的解释轻易说服", "b": "只要对方给出一段“看起来像理由”的解释，就算里面逻辑漏洞很多，我们也更容易顺从对方提出的要求。 存在理由，不等于理由本身有效。 比如，销售员给你介绍产品时，给出一段似是而非的原理，根本没有真实的数据支撑。但你仅仅因为他“给出了解释”，觉得他好像很专业，就相信了产品的效果，最后买回去发现根本没用。 重视理由倾向，就是人容易被一段看似合理的解释忽悠。所以，听到理由时别急着点头，多问一句“这理由站得住脚吗”，验证逻辑是否真正成立。", "sub": "人类误判心理倾向"}, {"name": "多重心理叠加倾向", "cat": "思维陷阱", "core": false, "file": "duo-zhong-xin-li-die-jia-qing-xiang.html", "intro": "警惕多重心理叠加带来的极端非理性", "b": "遇到事情的时候，多种心理弱点同时发作，互相放大，让你彻底失去理智，做出极其离谱的决定。 绝大多数重大踩坑事件，都不是单一心理缺陷导致，而是多重倾向叠加之后带来的结果。 就拿前几年的股市疯狂来说。当时身边所有人都在谈论股票，你本来不懂，但看到别人赚钱，贪婪和从众心理被同时激发。加上媒体天天报道牛市，你过度自信地觉得这次不一样，于是借了高利贷全仓买入。结果市场一回调，恐惧和损失厌恶又同时爆发，你在最低点割肉离场，最后亏掉了大半辈子的积蓄。 多重心理叠加倾向就是多个心理弱点同时爆发，让你彻底丧失理智。这会让你在情绪的最高点做出毁灭性的决定。所以，当你发现周围所有人都极度狂热时，先离开现场，等冷静了再做决定。", "sub": "人类误判心理倾向"}, {"name": "可得性启发", "cat": "思维陷阱", "core": false, "file": "ke-de-xing-qi-fa.html", "intro": "别仅凭脑海印象，就判断一件事发生的概率", "b": "做判断的时候，习惯直接拿脑子里最容易想起来的事情当依据，懒得去查真实的数据和全貌。 一件事容易被你想起，不等于这件事发生概率就很高。 你最近连续刷到好几条飞机失事的新闻，画面特别惨烈，你脑子里立刻就觉得坐飞机太危险了，于是改坐高铁。但实际上，如果你去查一下官方的统计数据，就会发现飞机失事的概率远低于汽车交通事故。你只是被最近看到的、冲击力强的新闻带偏了，忽略了真实的概率。 可得性启发就是拿脑子里印象最深的事当真理。这会让你严重误判真实的概率，做出错误的决定。所以，遇到重大决定时，别光凭记忆，去查查真实的统计数据再说。", "sub": "认知偏差"}, {"name": "后见之明偏见", "cat": "思维陷阱", "core": false, "file": "hou-jian-zhi-ming-pian-jian.html", "intro": "不要用结局倒推，美化自己当初的预判能力", "b": "事情发生之后，总觉得自己早就预料到了结果，完全忘了当时其实根本看不清局势。 事后看懂一切，不等于在事情发生前，我们就拥有精准预判的能力。 股市大跌之后，很多人拍着大腿说：“我早就看出来要跌了！”但实际上，在下跌之前，这些人并没有做出减仓、止损这类避险操作，甚至还在加仓。他们只是拿着现在的结局，去倒推当时的自己，制造出一种自己很有先见之明的假象。 后见之明偏见就是事后觉得自己早就料到了。这会让你盲目自信，学不到真教训。所以，复盘的时候，把当时掌握的真实信息写下来，别拿现在的结局去倒推当时的自己。", "sub": "认知偏差"}, {"name": "框架效应", "cat": "思维陷阱", "core": false, "file": "kuang-jia-xiao-ying.html", "intro": "警惕话术包装，不要换个说法就改变原有判断", "b": "明明是同一件事，只是别人换了一种说法，你的感受和决定就跟着完全变了。 语言可以改变我们的情绪感受，但是不会改变事实本身。 医生给你推荐一个手术，说“这项手术有 90% 的成功率”，你听完觉得挺靠谱，就签字了。但如果医生换一种说法，说“这项手术有 10% 的死亡率”，你听完可能马上就害怕了，拒绝签字。其实这两种说法对应的客观事实完全一样，只是框架变了，你的决定就跟着变了。 框架效应就是被别人的说法带着跑。这会让你在同样的事实面前做出矛盾的决定。所以，听到别人推销时，自己把这句话换成相反的说法再听一遍，看看事实到底变没变。", "sub": "认知偏差"}, {"name": "最省力法则", "cat": "思维陷阱", "core": false, "file": "zui-sheng-li-fa-ze.html", "intro": "别一味追求思考省力，重要问题拒绝只用直觉", "b": "遇到事情，本能地选择最不动脑子的方式去处理，直接凭直觉下结论，哪怕这个结论是错的。 省事的办法见效很快，但是很多时候会埋下长期隐患。 领导让你写一份业务分析报告，你觉得太费脑子，就直接从网上找了一个现成的模板，把去年的数据填进去交了差。你省事了，但完全没有思考今年业务下滑的真正原因。结果就是，领导觉得你缺乏深度思考的能力，以后重要的项目再也不敢交给你了。 最省力法则就是遇事只凭直觉不动脑子。这会让你长期停留在浅层思考，能力无法提升。所以，遇到复杂问题时，强迫自己停下来，拿出一张纸，把问题的逻辑一步步写下来。", "sub": "认知偏差"}, {"name": "自我损耗", "cat": "思维陷阱", "core": false, "file": "zi-wo-sun-hao.html", "intro": "意志力会越用越少，不要一次性透支自控力", "b": "你长时间强迫自己克制欲望、集中注意力之后，心理精力会被消耗一空。接下来的一段时间里，你的自制力会明显下降，更容易做出冲动的决定。 意志力不是无限供应的资源，强行透支，很容易出现情绪和行为失控。 你连续高强度加班了四个小时，处理了一堆棘手的客户投诉。下班后你感觉整个人被掏空了，路过烧烤摊，本来在减肥的你，根本管不住自己，点了一大堆高热量食物，还顺手在直播间冲动下单了一件根本不需要的衣服。这就是意志力耗尽后的典型失控。 自我损耗就是意志力被用光了导致失控。这会让你在疲惫时做出冲动的蠢事。所以，当你感觉特别累、特别想放纵的时候，别做重大决定，先去睡一觉或者吃点东西恢复一下。", "sub": "认知偏差"}, {"name": "启动效应", "cat": "思维陷阱", "core": false, "file": "qi-dong-xiao-ying.html", "intro": "警惕隐形暗示，不要在无意识里被信息改变想法", "b": "你之前看到的词语、图片或观念，会悄悄留在脑子里。在无意识的状态下，这些信息会影响你之后的想法和行为。 这类影响藏在潜意识里，光靠意志力硬扛很难完全规避。 心理学家做过一个经典的实验。他们让两组人分别阅读包含“年老”“健忘”“皱纹”等词汇的文章。读完之后，那些读了相关词汇的人，在走出实验室时，走路的步伐明显比另一组人慢了很多。这就是启动效应在无形中改变了人的行为。 启动效应就是之前的所见所闻，在无形中影响了你现在的判断。所以，做重要决定前，先想想自己最近看了什么、听了什么，剥离掉那些隐蔽的暗示，再按真实需求做选择。", "sub": "认知偏差"}, {"name": "麦克白效应", "cat": "思维陷阱", "core": false, "file": "mai-ke-bai-xiao-ying.html", "intro": "不要只用表面行为缓解愧疚，要正视问题根源", "b": "当你心里产生愧疚或负罪感之后，会下意识地产生清洗身体的冲动，希望依靠清洁行为来缓解内心的不安。 身体清洁只能短暂安抚情绪，解决不了心里真正纠结的矛盾。 你在背后说了朋友的坏话，事后心里十分内疚。明明手上并不脏，你却反复跑去洗手，靠这个动作来缓解心里的不安。但洗得再干净，你也知道，真正该做的是去跟朋友沟通道歉，而不是在这里洗手。 麦克白效应就是用物理上的清洁，来掩盖心理上的愧疚。所以，当你想靠打扫卫生或洗澡来逃避问题时，停下来，去直面那个让你内疚的根源，真正去弥补错误。", "sub": "认知偏差"}, {"name": "曝光效应", "cat": "思维陷阱", "core": false, "file": "bao-guang-xiao-ying.html", "intro": "别因为看得多就产生好感，熟悉不等于优质", "b": "一件事物你看见的次数越多，你就越容易对它产生好感，哪怕你并不了解它真实的好坏。 广告行业就是大量利用这个心理，反复刷存在感博取我们的好感。 一款饮料的广告你每天都在电梯里刷到，虽然你从来没有仔细品尝对比过，但逛超市的时候，你会下意识地优先选择这一款。你以为是自己喜欢这个味道，其实只是大脑被高频曝光欺骗了。 曝光效应就是看得多了，你就会莫名其妙地产生好感。所以，面对那些天天在你眼前晃的东西，先抛开熟悉感，用实际性能和逻辑去重新评估它到底值不值得。", "sub": "认知偏差"}, {"name": "规划谬误", "cat": "思维陷阱", "core": false, "file": "gui-hua-miu-wu.html", "intro": "做计划别过度乐观，一定要预留应对意外的缓冲时间", "b": "给自己制定计划的时候，习惯性高估自己的效率，低估完成一件事需要的时间、成本以及过程里会出现的意外麻烦。 我们脑海里“一帆风顺”的理想版本，在现实里几乎不会出现。 你预估一份报告 3 天就可以写完，觉得过程不会遇到任何阻碍。结果中途不断出现资料查找困难、跨部门沟通调整等问题，最后整整花了两周才做完。这就是典型的规划谬误，因为没有把意外算进去。 规划谬误就是做计划时只想象理想状态，忽略了意外。所以，做计划时一定要参考过去的真实耗时，并强制预留缓冲时间，接纳中途一定会出现意外。", "sub": "认知偏差"}, {"name": "忽视基础概率", "cat": "思维陷阱", "core": false, "file": "hu-shi-ji-chu-gai-lv.html", "intro": "别拿少数个案当成普遍规律，要参考整体真实概率", "b": "我们很容易被眼前个别鲜活的案例打动，直接忽略这件事在整体环境里真实的发生比例，靠着个案就下判断。 媒体喜欢报道少数传奇案例，不会去描述大多数普通人的普通结果。 你身边有一个朋友炒股短期内赚了一大笔，你觉得普通人炒股也很容易暴富，于是直接重仓入场。但你忽略了绝大多数散户长期亏钱这个客观事实，最终大概率会亏掉本金。 忽视基础概率就是被少数传奇案例冲昏头脑，忽略了整体成功率。所以，做决策时一定要去查查这件事真实的整体概率，别拿别人的偶然当成自己的必然。", "sub": "认知偏差"}, {"name": "前景理论", "cat": "思维陷阱", "core": false, "file": "qian-jing-li-lun.html", "intro": "盈利容易保守、亏损容易冒险，提前定规则对抗心态失衡", "b": "面对收益和亏损的时候，我们的风险偏好会自动发生变化。拿到收益时我们倾向保守求稳，面对亏损时反而愿意冒险赌一把，无法保持统一的理性标准。 这四种心理经常同时出现，共同影响我们在不确定环境里的每一次选择。 基金刚上涨 2% 你就慌忙卖出，害怕到手的利润消失。但当持仓出现亏损之后，你反而不愿意卖出，一直抱着等待回本，最后亏损持续扩大。这就是典型的前景理论在作祟。 前景理论就是人在面对盈亏时心态会失衡，赚了就跑，亏了死扛。所以，提前定好交易规则，用规则约束情绪化操作，到了止损线就坚决执行。", "sub": "认知偏差"}, {"name": "禀赋效应", "cat": "思维陷阱", "core": false, "file": "bing-fu-xiao-ying.html", "intro": "自己手里的东西更容易被高估，交易要跳出主观情感", "b": "一旦某件东西归我们自己所有之后，我们就会不自觉抬高它的心理价值，哪怕这件东西客观市场价格并没有那么高。 很多商家推出试用体验，就是利用禀赋效应，让我们产生拥有感之后，更容易买单。 一副耳机你自己长期在用，明明市场同款二手价很低，你总觉得自己这一副更有感情、更有意义，坚持开出很高的售价，结果长时间都卖不出去。 禀赋效应就是拥有之后容易高估物品的价值。所以，交易或断舍离时，刻意切换成买家视角，用市场真实行情作为参考，别被自己的感情绑架。", "sub": "认知偏差"}, {"name": "心理账户", "cat": "思维陷阱", "core": false, "file": "xin-li-zhang-hu.html", "intro": "不要把钱在心里人为分区，站在总资产角度规划开支", "b": "我们会在心里把钱分成一个个独立账户，比如工资、奖金、红包。明明钱本身可以互通，我们却用不一样的标准去花每一笔钱。 各类平台赠送的优惠券、积分，也很容易触发我们的心理账户，诱导额外消费。 辛辛苦苦赚来的工资，每一笔支出你都精打细算。但年终奖到手之后，你就觉得这是额外奖励，很大方直接用来旅游或者买奢侈品，不会像对待工资那样谨慎。 心理账户就是我们在心里把钱分门别类，用不同的标准去花。所以，花钱时要站在总资产的视角统一规划，钱就是钱，不管它从哪里来，花出去的价值是一样的。", "sub": "认知偏差"}, {"name": "处置效应", "cat": "思维陷阱", "core": false, "file": "chu-zhi-xiao-ying.html", "intro": "别着急卖掉盈利标的、死扛亏损标的，按标准执行交易", "b": "在投资的时候，我们总喜欢把小幅盈利的资产快速卖出落袋为安，却死死拿着已经亏损的资产，一直等待回本。 回本并不是合理的卖出理由，资产未来价值才是我们持有与否的核心标准。 你手里有两只股票，一只小幅上涨了 5%，一只已经下跌了 20%。你为了保住那微薄的收益，赶紧把上涨的那只卖了；却死死拿着下跌的那只等待反弹。结果上涨的继续大涨，下跌的持续创新低，最后你深套其中。 处置效应，就是买卖被当下的盈亏绑架。提前制定好止盈止损的标准，依靠规则执行投资操作，你才能避免赚小钱亏大钱。", "sub": "认知偏差"}, {"name": "证实偏差", "cat": "思维陷阱", "core": false, "file": "zheng-shi-pian-cha.html", "intro": "别只看认同自己的观点，主动查看反面证据", "b": "当我们内心已经认定某一个观点之后，就会主动寻找支持自己想法的信息，下意识忽略那些反驳自己的证据。 短视频平台的算法推荐，会不断放大证实偏差，给我们推送同质化内容。 你本身相信某个星座性格理论，刷到符合自己星座特征的内容就十分认同，疯狂点赞收藏。但一看到反驳星座理论的科普视频，你直接快速划走，连一秒钟都不愿意认真看完。 证实偏差，就是只收集能够迎合自己想法的信息。主动去接触反面观点，逼自己看看有没有不成立的情况，你才能打破认知茧房。", "sub": "认知偏差"}, {"name": "幸存者偏差", "cat": "思维陷阱", "core": false, "file": "xing-cun-zhe-pian-cha.html", "intro": "不要只学习成功者经验，也要看见大量沉默的失败者", "b": "我们只能看到那些成功、留存下来的案例，大量失败消失的案例不会对外发声，我们很容易忽略这群沉默的大多数。 只看胜利者总结经验，得到的结论往往是残缺片面的。 很多年轻人看了几个白手起家创业者的采访，觉得创业赚钱很轻松，于是辞职去开奶茶店。但他们忽略了，绝大多数创业项目都会在几年之内倒闭，那些倒闭的老板根本不会上电视接受采访。 幸存者偏差，就是只参考胜利者的故事，忽略了沉默的大多数。想要完整看清一件事，也要去留意失败者的教训，你才不会盲目入局。", "sub": "认知偏差"}, {"name": "小数定律", "cat": "思维陷阱", "core": false, "file": "xiao-shu-ding-lv.html", "intro": "别依靠少量案例总结通用规律，小样本不能代表整体", "b": "我们只依靠身边少数几个案例，就急于总结出一条普遍规律，直接认为这套规律放到所有人身上都成立。 3‑5个身边案例，只能代表局部情况，不足以支撑普适结论。 你身边有三个人做直播带货赚到了钱，你就直接得出“普通人做直播很容易赚钱”的结论，立刻辞职入局。却不知道大量直播间根本没有收入，你看到的只是极少数的幸存者。 小数定律，就是依靠少数几个案例，就急于总结出普遍规律。把小样本只当作探索线索，不把它当成通用准则，你才不会因为偶然现象而持续碰壁。", "sub": "认知偏差"}, {"name": "大数定律", "cat": "思维陷阱", "core": false, "file": "da-shu-ding-lv.html", "intro": "不要拿短期结果判定长期趋势，拉长周期观察规律", "b": "一件事情重复的次数越多，最终结果才会贴近真实概率；但我们常常拿短期少量结果，直接判定长期规律。 短期波动可以是随机运气，只有长期大量重复之后，真实规律才会慢慢显露。 某一只基金近三个月收益暴涨，很多人直接认定它是优质产品，大额买入。却不去查看它过去三五年长期的综合收益水平，结果买在了短期高点，随后开始长期阴跌。 大数定律，就是拿短期少量结果，直接判定长期规律。拉长观察周期，接受短期的随机波动，你才能看清真正的长期趋势。", "sub": "认知偏差"}, {"name": "结果偏见", "cat": "思维陷阱", "core": false, "file": "jie-guo-pian-jian.html", "intro": "不要只靠成败评判决策好坏，要复盘当时思考逻辑", "b": "我们总是习惯用最终的成败结果，直接去评判当初那一次决策到底好不好，完全忽略了当时手里掌握的真实信息和思考逻辑。 好决策也有可能因为运气变差而失败；烂决策也有可能依靠短期运气拿到好结果。 就拿炒股来说。有人完全凭感觉，在大跌之前卖出了股票，刚好躲过了亏损。事后大家都称赞他预判精准，觉得他是股神。但如果还原到当时，他其实并没有完整的数据和逻辑支撑，只是单纯碰运气蒙对了。如果以后还按这个“感觉”去操作，早晚会亏回去。 结果偏见就是让你错把运气当能力。复盘的时候，重点去检查当时的思考过程合不合理，而不是单纯盯着最后的输赢看。", "sub": "认知偏差"}, {"name": "认知放松", "cat": "思维陷阱", "core": false, "file": "ren-zhi-fang-song.html", "intro": "顺口好懂不等于真相，简单观点也要核查支撑依据", "b": "当一段文字或者一个观点读起来特别通顺顺口、看着简单好懂的时候，我们的大脑就会自动放松警惕，下意识认为它大概率是真的，根本不会主动去深究它的真伪。 很多爆款短视频金句、广告语，都专门利用认知放松降低我们的防备心理。 就拿短视频里经常刷到的那些养生口诀来说。比如“每天喝柠檬水可以抗癌”，这句话特别简单顺口，你下意识就会觉得说得很对，甚至马上转发给家人。但实际上，这条说法根本没有权威的医学实验作为支撑，只是利用了人们喜欢简单答案的心理。 认知放松就是让你因为读得顺，就信以为真。遇到那些特别洗脑的短句，主动停下来，去查一查它背后的证据到底在不在。", "sub": "认知偏差"}, {"name": "一元思维", "cat": "思维陷阱", "core": false, "file": "yi-yuan-si-wei.html", "intro": "拒绝经验照搬，遇事具体问题具体分析", "b": "遇到复杂问题的时候，你习惯性只盯着一个点找原因。觉得只要把这个点解决了，事情就搞定了，完全忽略了整件事其实是多重因素共同造成的。 事情可以有主要原因，但几乎没有唯一原因，不要被第一直觉带偏。 就拿孩子成绩下降来说。很多家长第一反应就是怪孩子贪玩，然后就直接靠批评施压。但他们其实忽略了，课程难度是不是变大了？孩子最近是不是有心理压力？学习方法是不是出了问题？如果只盯着“贪玩”这一个点去解决，问题永远都解决不彻底。 一元思维就是遇到问题只能看到一个原因，它会让你遇到复杂问题时，不断踩坑。所以，以后遇到问题时，别急着下结论，先停下来，逼自己找出3个可能的原因，再去动手解决。", "sub": "错误的思维方式"}, {"name": "二元思维", "cat": "思维陷阱", "core": false, "file": "er-yuan-si-wei.html", "intro": "跳出非黑即白，看清事物利弊共存", "b": "看问题的时候，习惯走极端，非黑即白地看问题。要么觉得全都对，要么觉得全都错，完全看不到事情利弊共存的状态。 现实绝大多数事情没有绝对对错，只有适不适合、值不值得。 就拿看待金钱来说。有的人觉得钱是万能的，只要有钱就能解决一切；但有的人又觉得谈钱太俗，钱是肮脏的。这就是典型的二元思维。他们完全看不到，钱在不同的场景下，既能带来自由，也可能带来烦恼，它是有两面性的。 二元思维就是把事情简单分成“好坏”“对错”，但这个世界并不是非黑即白的。所以，下次遇到分歧时，别急着站队，先问自己一句：“这个观点在什么情况下是对的，在什么情况下是错的？”", "sub": "错误的思维方式"}, {"name": "惯性思维 / 直觉", "cat": "思维陷阱", "core": false, "file": "guan-xing-si-wei.html", "intro": "拒绝经验照搬，遇事具体问题具体分析", "b": "遇到问题的时候，习惯性照搬过去的经验，直接靠直觉下判断。这样就不会结合当下的新情况去具体分析了，总是用老套路去解决新问题。 经验可以参考，但不能直接套用。环境一变，老经验大概率失效。 就拿买水果来说。以前我们挑水果，只选外观好看的，习惯性避开有斑点的果子。哪怕后来知道了有些带斑点的水果反而更甜，但一到水果摊，还是改不了固有的挑选习惯，最后总是错失更好的选择。 惯性思维就是遇到事直接套用老办法，不懂得变通。这会导致你掉进自己的思维陷阱里。所以，下次遇到问题时，先想一下：现在的情况，跟以前真的一样吗？", "sub": "错误的思维方式"}, {"name": "路径依赖", "cat": "思维陷阱", "core": false, "file": "lu-jing-yi-lai.html", "intro": "不困于旧习惯，主动跳出固化做事路径", "b": "长期依赖过去熟悉的方法和路径。哪怕这套方法已经低效、落后、不适用了，也不愿意改变，就是不愿意换新方式。 路径依赖不是做错，是低效又不进步。环境变了你还停在原地，落后就是这么一点点攒出来的。 就拿家里的长辈来说。他们一辈子只用现金付款，明明手机支付更便捷、省时，但因为习惯了旧方式，坚决不学新工具。结果呢？不仅自己出门买菜找零麻烦，还经常错过各种线上优惠，无形中增加了生活成本。 路径依赖就是明明老办法已经不行了，还死抱着不放。这会让你跟不上时代的脚步。这需要你定期的复盘和自省，摆脱对旧经验、旧工具的依赖。", "sub": "错误的思维方式"}, {"name": "线性思维", "cat": "思维陷阱", "core": false, "file": "xian-xing-si-wei.html", "intro": "拒绝简单累加思维，看懂现实的复杂规律", "b": "简单认定一个原因就对应一个结果，总觉得付出多少就一定能收获多少。这样就完全忽略了现实中复杂的联动关系，以及各种变量带来的影响。 人生、学习、赚钱都是非线性的，不是累加就必胜，存在波动、瓶颈、突变。 就拿学英语来说。很多人认为每天背10个单词，一年就能学好英语。这就是典型的线性思维。他们只机械地累加数量，却忽略了复习、语法、口语、实际应用这些关键环节。结果呢？背了几千个单词，真遇到老外还是张不开嘴。 线性思维就是，认为只要努力了就一定会有好结果。这就可能会让你在失败时大受打击。所以，在做重要计划时，别只考虑顺利的情况，还要列出至少2个可能导致失败的意外因素，并提前想好应对办法。", "sub": "错误的思维方式"}, {"name": "绝对思维", "cat": "思维陷阱", "core": false, "file": "jue-dui-si-wei.html", "intro": "摒弃死板定论，学会分场景灵活判断", "b": "遇到事情的时候，习惯用绝对、死板的标准去衡量，认定规则和道理永远不会变，完全不接受场景的差异和特殊情况。 所有道理都有适用边界，没有任何一句话、一个规则可以通吃所有场景。 三国里的马谡失街亭就是典型的绝对思维。马谡死守兵书上“居高临下，势如破竹”的教条，不听王平的劝告，非要把军队驻扎在山顶上。他完全没考虑实际地形没有水源这个关键变量，结果被张郃断了水道，全军覆没。把书本上的道理当成永远正确的绝对真理，不看实际情况，这就是绝对思维害死人。 绝对思维就是认定道理永远不会变，不管什么场景都死守一条规则。这会让你在复杂的人际关系和社会环境里处处碰壁。所以，下次遇到事情时，先看看当下的场景，再决定用哪条道理，别一刀切。", "sub": "错误的思维方式"}, {"name": "学生思维", "cat": "思维陷阱", "core": false, "file": "xue-sheng-si-wei.html", "intro": "告别被动等待，主动思考主动解决问题", "b": "遇到问题的时候，习惯等待标准答案，或者等待别人来安排。不会主动去思考、主动去解决问题，过度依赖别人的指导，缺少独立探索的能力。 社会没有统一标准答案，结果导向、解决问题，就是唯一标准。 领导安排了一句“做一份活动方案”，有的新人就不动了。不主动问需求、不查资料、不构思框架，坐在那里等领导逐条教、逐条安排。最后领导觉得他完全没有独立做事的能力，以后重要的活也不敢交给他了。而同期进来的另一个同事，接到同样的任务，先自己查了竞品、列了框架、写了初稿，哪怕做得不完美，领导也愿意继续培养他。 学生思维就是习惯了等别人给答案、等别人安排，不会主动思考和解决问题。这会让你进入职场后极度被动，成长速度远远落后于身边的人。所以，下次遇到问题时，别第一时间等别人来教你，先自己想办法，哪怕想得不完美，也比干等着强。", "sub": "错误的思维方式"}, {"name": "穷人思维", "cat": "思维陷阱", "core": false, "file": "qiong-ren-si-wei.html", "intro": "拒绝短视消费，学会为长期成长和未来布局", "b": "只看重当下的省钱和即时享受，不愿为长远成长和未来收益投入。只顾眼前，没有长期的规划。 省钱攒不下未来，提升能力、积累资源，才能真正改变收入层级。 巴菲特说过一句话：最好的投资就是投资你自己。他年轻的时候，花了一百多美元去上卡耐基的演讲课，这笔钱在当时不算小数目，但这门课帮他克服了公开演讲的恐惧，后来他在股东大会上侃侃而谈的能力，很大程度上就来自那次投入。反观很多人，发了工资第一时间买新款手机、买奢侈品，但让他花几百块学个技能、报个课程，他就舍不得了。只顾当下舒服，结果几年下来，钱没攒下，本事也没长进。 穷人思维就是只盯着眼前的省钱和享乐，不愿意为长远的成长投入。这会让你一直停留在即时消耗的模式里，越忙越穷。所以，下次花钱之前，先问自己一句：这笔钱是花在了享乐上，还是花在了能让自己增值的地方？", "sub": "错误的思维方式"}, {"name": "弱者思维", "cat": "思维陷阱", "core": false, "file": "ruo-zhe-si-wei.html", "intro": "停止向外抱怨，向内归因主动自救", "b": "遇到问题的时候，第一反应就是抱怨外部环境、推卸责任。习惯性示弱、依赖他人，从来不主动找自己的问题，也不主动去破局。 抱怨只会消耗自己，复盘和改变，才能真正解决问题。 项目进度滞后了，有的人不反思自己效率低、方法差，一味抱怨客户多变、同事不配合、时间不够。从来不主动推进、主动补救，最后项目黄了，还觉得全是别人的错。而真正厉害的人，遇到同样的情况，第一反应是：我哪里可以做得更好？哪些环节我可以主动去推动？把能控制的部分先做好，局面往往就扭转了。 弱者思维就是遇到问题第一反应就是抱怨外部环境、推卸责任，从来不找自己的原因。这会让你永远停留在被动受害者的位置上，能力永远无法成长。所以，下次出了问题，先问自己：这件事里，我自己哪里可以做得更好？", "sub": "错误的思维方式"}, {"name": "打工思维", "cat": "思维陷阱", "core": false, "file": "da-gong-si-wei.html", "intro": "跳出交易心态，把工作当成自我成长的载体", "b": "把工作单纯当成换工资的交易。只做分内事、只做给钱的事，拒绝额外的付出，完全不关注自我的成长。 职场短期看薪资，长期看能力，能力到位，收入自然翻倍。 领导安排了一项额外的调研工作，有的人觉得不是分内事、没加班费，就敷衍应付。但他完全看不到，这项调研能帮他积累业务认知和分析能力，这些能力长在他自己身上，以后跳槽、升职都用得上。而那些愿意多做一步的人，表面上看是多干了活，实际上是在用公司的资源给自己攒本事。两三年之后，差距就拉开了。 打工思维就是把工作单纯当成换工资的交易，只做分内事，拒绝额外付出。这会让你长期沦为被动执行的工具人，职场竞争力停滞不前。所以，下次遇到分外的工作时，先想想这件事能不能帮你积累经验、拓展能力，别只盯着眼前的加班费。", "sub": "错误的思维方式"}, {"name": "伪科学思维", "cat": "思维陷阱", "core": false, "file": "wei-ke-xue-si-wei.html", "intro": "拒绝主观臆断，重要判断必须讲依据", "b": "遇到事情的时候，你习惯性只凭感觉、传言或者个人喜好来做判断，根本不去查证客观事实和真实依据，特别容易相信那些没有根据的信息。 听起来好听、符合自己预期的话，大概率是谣言，越舒服越要警惕。 之前网上流传“喝碱性水能防癌”的说法，很多人连基本的医学依据都不去查，就直接花高价购买了所谓的碱性水设备，还强迫家人每天喝。结果钱白白浪费了，身体也没得到任何好处。 伪科学思维就是遇到问题只凭感觉和传言做判断，不去查证事实。这会让你轻易被谣言误导。所以，遇到涉及健康或钱财的大事，先去查查权威依据，别听风就是雨。", "sub": "错误的思维方式"}, {"name": "结构化思维", "cat": "顶级思维模型", "core": true, "file": "jie-gou-hua-si-wei.html", "intro": "先定目标，再搭不重不漏的框架", "t": "常见痛点 实操落地步骤 误区边界 总结提示 MECE 相互独立 完全穷尽", "m": "思考混乱 抓不住重点 表达条理不清 没有稳定主线 以终为始 目标导向 过度拆分", "b": "明确最终目标 统一拆分标准 搭建顶层框架 复盘迭代 衣柜规整"}, {"name": "第一性原理", "cat": "顶级思维模型", "core": true, "file": "di-yi-xing-yuan-li.html", "intro": "抛开经验，从底层事实重新推导", "t": "常见痛点 实操落地步骤 误区边界 总结提示 类比思维 从零推导", "m": "经验依赖 认知片面 解决低效 固有认知 类比照搬 底层事实", "b": "清空固有认知 深挖底层事实 重构可行方案 5Why 马斯克 电池成本 否定经验"}, {"name": "辩证思维", "cat": "顶级思维模型", "core": true, "file": "bian-zheng-si-wei.html", "intro": "打破非黑即白，多角度看清问题", "t": "常见痛点 实操落地步骤 误区边界 总结提示 对立统一 发展 矛盾 质疑", "m": "非黑即白 绝对化 道德绑架 吃亏 站队 认知局限 环境变化 左右摇摆", "b": "摒弃二元思维 发展视角 矛盾双向 理性质疑 吃亏是福"}, {"name": "逻辑思维", "cat": "顶级思维模型", "core": true, "file": "luo-ji-si-wei.html", "intro": "从经历中找规律，用规律做决定", "t": "常见痛点 实操落地步骤 误区边界 总结提示 归纳法 演绎法", "m": "减少情绪直觉错误判断 总结靠谱规律 自我复盘 决策出错 情绪内耗 底层原因 辩论抬杠", "b": "事实收集 总结规律 匹配现状 推导方案 验证迭代 归纳汇聚 演绎发散 作息精力"}, {"name": "抽象思维", "cat": "顶级思维模型", "core": true, "file": "chou-xiang-si-wei.html", "intro": "遇事聚焦主要矛盾，从多件事件提炼共性，总结可迁移的通用规律", "t": "常见痛点 实操落地步骤 误区边界 总结提示 聚焦主要矛盾 寻找共性 通用规律", "m": "经验复用 信息判断 复盘总结 次要细节 主要矛盾 同类事件 沉淀规律", "b": "复盘真实事件 聚焦主要矛盾 寻找共性 总结通用规律 客户沟通 交付节点 时间节点"}, {"name": "系统思维", "cat": "顶级思维模型", "core": true, " <script>

function openSide(){ if(sideNav){ sideNav.classList.add('open'); sideOverlay && sideOverlay.classList.add('show'); } }
function closeSide(){ if(sideNav){ sideNav.classList.remove('open'); sideOverlay && sideOverlay.classList.remove('show'); } }
if(menuToggle){
  function onMenuTap(e){
    e.preventDefault ? e.preventDefault() : (e.returnValue = false);
    e.stopPropagation ? e.stopPropagation() : (e.cancelBubble = true);
    sideNav.classList.contains('open') ? closeSide() : openSide();
  }

  menuToggle.addEventListener('touchstart', onMenuTap, {passive:false});
}
if(sideOverlay){ sideOverlay.addEventListener('click', closeSide); sideOverlay.addEventListener('touchstart', closeSide, {passive:false}); }
/* 点击侧边栏链接后，移动端自动关闭抽屉 */

sideLinks.forEach(function(a){ a.addEventListener('click', function(){ if(window.innerWidth <= 900) closeSide(); }); });

/* 侧边栏手动滚动箭头 */
(function(){
  var scroll = document.getElementById('sideScroll');
  var up = document.getElementById('sideUp');
  var down = document.getElementById('sideDown');
  var hint = document.getElementById('sideHint');
  if(!scroll || !up || !down) return;
  var step = 112;
  var hideTimer = null;
  function showHint(text, isTop){
    if(!hint) return;
    hint.textContent = text;
    hint.className = 'side-hint ' + (isTop ? 'top' : 'bottom');
    requestAnimationFrame(function(){ hint.classList.add('show'); });
    if(hideTimer) clearTimeout(hideTimer);
    hideTimer = setTimeout(function(){ hint.classList.remove('show'); }, 1400);
  }
  function updateArrows(){
    var sh = scroll.scrollHeight, st = scroll.scrollTop, ch = scroll.clientHeight;
    var atTop = st <= 1;
    var atBottom = st + ch >= sh - 1;
    up.disabled = atTop;
    up.classList.toggle('disabled', atTop);
    down.disabled = atBottom;
    down.classList.toggle('disabled', atBottom);
  }
  function scrollBy(delta){
    scroll.scrollBy({top: delta, behavior: 'smooth'});
  }
  up.addEventListener('click', function(){
    if(scroll.scrollTop <= 1){ showHint('已到达顶部', true); return; }
    scrollBy(-step);
  });
  down.addEventListener('click', function(){
    if(scroll.scrollTop + scroll.clientHeight >= scroll.scrollHeight - 1){ showHint('已到达底部', false); return; }
    scrollBy(step);
  });
  scroll.addEventListener('scroll', updateArrows, {passive: true});
  /* 有选中分类时，把侧栏滚动到选中项可见（尽量居中），避免选中最底部分类时高亮在可视区外 */
  var act = scroll.querySelector('a.active');

    var actRect = act.getBoundingClientRect();
    var scRect = scroll.getBoundingClientRect();
    scroll.scrollTop += (actRect.top + actRect.height / 2) - (scRect.top + scRect.height / 2);
  }
  window.addEventListener('load', updateArrows);
  updateArrows();
})();

/* 全局流程图悬停提示：避免被 .flow-scroll 的 overflow-x 裁剪 */
(function(){
  var globalTip = document.createElement('div');
  globalTip.id = 'global-tip';
  globalTip.className = 'global-tip';
  document.body.appendChild(globalTip);
  var activeNode = null;

  function positionTip(node){
    var tip = node.querySelector('.tip');
    if(!tip) return false;
    globalTip.innerHTML = tip.innerHTML;
    var rect = node.getBoundingClientRect();
    var vw = window.innerWidth || document.documentElement.clientWidth;
    // H5 下限制 tip 最大宽度，避免溢出屏幕
    if(vw <= 720){
      globalTip.style.maxWidth = Math.max(180, vw - 32) + 'px';
    }else{
      globalTip.style.maxWidth = '320px';
    }
    globalTip.style.width = 'auto';
    var tipRect = globalTip.getBoundingClientRect();
    var top = rect.top - tipRect.height - 10;
    var center = rect.left + rect.width/2;
    var left = center - tipRect.width/2;
    var minLeft = 16;
    var maxLeft = vw - tipRect.width - 16;
    if(maxLeft < minLeft){ maxLeft = minLeft; }
    if(left < minLeft) left = minLeft;
    if(left > maxLeft) left = maxLeft;
    globalTip.style.left = left + 'px';
    globalTip.style.top = top + 'px';
    globalTip.style.transform = 'none';
    return true;
  }

  function showTip(node){
    if(positionTip(node)){
      activeNode = node;
      globalTip.classList.add('show');
    }
  }

  function hideTip(){
    activeNode = null;
    globalTip.classList.remove('show');
  }

  document.body.addEventListener('mouseover', function(e){
    var node = e.target.closest('.node');
    if(node) showTip(node);
  });
  document.body.addEventListener('mouseout', function(e){
    var node = e.target.closest('.node');
    if(node && activeNode === node) hideTip();
  });

  /* 移动端：点击节点切换提示 */
  document.body.addEventListener('click', function(e){
    var node = e.target.closest('.node');
    if(!node) return;
    if(activeNode === node){ hideTip(); }
    else { showTip(node); }
  });

  window.addEventListener('scroll', hideTip, {passive:true});
  window.addEventListener('resize', hideTip);
})();

/* 回环反馈线：按流程图首尾节点的实际位置动态绘制，宽度随内容自适应 */
(function(){
  function drawLoops(){
    var wraps = document.querySelectorAll('.loop-wrap');
    for(var i=0;i<wraps.length;i++){
      var lw = wraps[i];
      var svg = lw.querySelector('svg');
      if(!svg) continue;
      var path = svg.querySelector('path[marker-end]');
      var text = svg.querySelector('text');
      var sec = lw.closest('section') || lw.parentElement;
      var flow = sec ? sec.querySelector('.flow') : null;
      if(!path || !flow) continue;
      var nodes = flow.querySelectorAll('.node');
      if(nodes.length < 2) continue;
      var base = svg.getBoundingClientRect();
      if(base.width < 60) continue;
      var fr = nodes[0].getBoundingClientRect();
      var lr = nodes[nodes.length-1].getBoundingClientRect();
      var L = fr.left + fr.width/2 - base.left;
      var R = lr.left + lr.width/2 - base.left;
      var pad = 14;
      L = Math.max(pad, Math.min(L, base.width - pad));
      R = Math.max(pad + 40, Math.min(R, base.width - pad));
      if(R - L < 60) continue;
      svg.setAttribute('viewBox', '0 0 ' + Math.round(base.width) + ' 76');
      path.setAttribute('d', 'M' + R + ' 14 V44 Q' + R + ' 52 ' + (R-8) + ' 52 H' + (L+8) + ' Q' + L + ' 52 ' + L + ' 44 V18');
      if(text) text.setAttribute('x', (L + R) / 2);
    }
  }
  window.addEventListener('load', drawLoops);
  window.addEventListener('resize', drawLoops);
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(drawLoops); }
  setTimeout(drawLoops, 60);
})();
</script>
